<script>
/* TRIP wird von tools/build.py aus web/trip.json eingesetzt. */
const TRIP = %%TRIP%%;
const TZ = 'America/Sao_Paulo';
const PEOPLE = ['Jonas', 'Patrick', 'Simon', 'Marco', 'Dajo', 'Greisel', 'Alle'];
const PRINT = location.hash === '#print';

const store = {
  get(k) { try { return localStorage.getItem('br26.' + k); } catch (e) { return null; } },
  set(k, v) { try { localStorage.setItem('br26.' + k, v); } catch (e) {} }
};
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;'}[c]));

function isoToday() {
  return new Intl.DateTimeFormat('en-CA', {timeZone: TZ, year: 'numeric', month: '2-digit', day: '2-digit'}).format(new Date());
}
function dateObj(iso) { return new Date(iso + 'T12:00:00Z'); }
function fmtDay(iso) {
  const d = dateObj(iso);
  const wd = new Intl.DateTimeFormat('de-DE', {weekday: 'short', timeZone: 'UTC'}).format(d).replace('.', '');
  return {wd, dm: String(d.getUTCDate()).padStart(2, '0') + '.' + String(d.getUTCMonth() + 1).padStart(2, '0') + '.'};
}
function daysBetween(a, b) { return Math.round((dateObj(b) - dateObj(a)) / 864e5); }
const forGroup = (g) => TRIP.days.filter(d => g === 'all' || d.g === 'all' || d.g === g);
const gName = g => g === 'a' ? 'Gringos plus 1 Cevapi' : 'Dajo & Greisel';

let G = PRINT ? 'all' : (store.get('group') === 'b' ? 'b' : 'a');

/* ---------- Heute ---------- */
function itemsHtml(items) {
  return '<ul>' + items.map(it =>
    '<li><span class="t">' + esc(it.time || '') + '</span><span>' + esc(it.text) +
    (it.unsicher ? ' <span class="unsure">(offen)</span>' : '') + '</span></li>').join('') + '</ul>';
}
/* Bild zur Station (Kopie aus den Stationen, IDs eindeutig gemacht) */
const SCENE_OF = {'Guarujá': 'guaruja', 'Rio de Janeiro': 'rio', 'Foz do Iguaçu': 'iguacu', 'Manaus': 'manaus', 'Juma Lodge': 'juma', 'Paraty': 'paraty', 'Ilha Grande': 'ilha'};
let sceneN = 0;
function sceneHtml(place) {
  const src = document.querySelector('.stop-img[data-scene="' + SCENE_OF[place] + '"]');
  if (!src) return '';
  const n = 't' + (++sceneN);
  let h = src.innerHTML;
  (h.match(/id="([^"]+)"/g) || []).forEach(m => { const id = m.slice(4, -1); h = h.split('id="' + id + '"').join('id="' + id + n + '"').split('url(#' + id + ')').join('url(#' + id + n + ')'); });
  return '<div class="today-img" aria-hidden="true">' + h + '</div>';
}
function setSkyTime() {
  const hr = +new Intl.DateTimeFormat('en-GB', {timeZone: TZ, hour: '2-digit', hour12: false}).format(new Date()) % 24;
  const t = hr >= 5 && hr < 8 ? 'morning' : hr >= 8 && hr < 17 ? 'day' : hr >= 17 && hr < 20 ? 'sunset' : 'night';
  const h = document.querySelector('header'); if (h) h.dataset.time = t;
}
setSkyTime(); setInterval(setSkyTime, 10 * 60000);
function renderToday() {
  const el = document.getElementById('today');
  const t = isoToday();
  const list = forGroup(G);
  const first = list[0].date, last = list[list.length - 1].date;
  let html;
  if (t < first) {
    const n = daysBetween(t, first);
    const d0 = list[0];
    html = sceneHtml(list.find(d => SCENE_OF[d.place]).place) + '<div class="kicker">' + esc(gName(G)) + ' · Countdown</div>' +
      '<div class="big">Noch ' + n + (n === 1 ? ' Tag' : ' Tage') + '<small>bis zum Abflug am ' + fmtDay(first).wd + ' ' + fmtDay(first).dm + ' · erster Stopp: ' + esc(list.find(d => d.place !== 'München')?.place || d0.place) + '</small></div>' +
      itemsHtml(d0.items) +
      '<div class="next">🎁 <a href="#kalender">Heutiges Türchen öffnen</a> · ⏳ <a href="#kapsel">Zeitkapsel</a></div>';
  } else if (t > last) {
    html = '<div class="kicker">' + esc(gName(G)) + '</div><div class="big">Tchau, Brasil<small>Die Reise ist vorbei. Obrigado und willkommen zurück!</small></div>';
  } else {
    const today = list.filter(d => d.date === t);
    const tomorrow = list.filter(d => d.date > t).filter((d, i, a) => d.date === a[0].date);
    const f = fmtDay(t);
    html = (today.length ? sceneHtml(today[0].place) : '') + '<div class="kicker">' + f.wd + ' ' + f.dm + ' · Tag ' + (daysBetween(first, t) + 1) + ' von ' + (daysBetween(first, last) + 1) + ' · ' + esc(gName(G)) + '</div>';
    if (today.length) {
      const d = today[0];
      html += '<div class="big">' + esc(d.place) + '<small>' + esc(d.title) + '</small></div>' +
        itemsHtml(today.flatMap(x => x.items)) +
        '<div class="stay">Schlafen: <b>' + esc(d.stay) + '</b></div>';
    }
    if (tomorrow.length) {
      const n = tomorrow[0], nf = fmtDay(n.date);
      html += '<div class="next">Morgen, ' + nf.wd + ' ' + nf.dm + ': <b>' + esc(n.title) + '</b> · ' + esc(n.place) +
        (n.items.find(i => i.time) ? ' · ab ' + esc(n.items.find(i => i.time).time) : '') + '</div>';
    }
  }
  el.innerHTML = html;
}

/* ---------- Tag fuer Tag ---------- */
function renderDays() {
  const t = isoToday();
  document.getElementById('days').innerHTML = forGroup(G).map(d => {
    const f = fmtDay(d.date);
    const tag = d.g === 'all' ? '' : '<span class="gtag">' + esc(gName(d.g)) + '</span>';
    return '<div class="day' + (d.date === t ? ' is-today' : '') + '"><div class="dt"><b>' + f.wd + ' ' + f.dm + '</b></div>' +
      '<div class="bd"><div class="ttl">' + esc(d.title) + tag + '</div><div class="plc">' + esc(d.place) + ' · ' + esc(d.stay) + '</div><ul>' +
      d.items.map(it => '<li>' + (it.time ? '<span class="tm">' + esc(it.time) + '</span> ' : '') + esc(it.text) +
        (it.unsicher ? ' <span class="unsure">(offen)</span>' : '') + '</li>').join('') +
      '</ul></div></div>';
  }).join('');
}

/* ---------- Flüge als Bordkarten ---------- */
const PLANE = '<svg viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M21 16v-2l-8-5V3.5a1.5 1.5 0 0 0-3 0V9l-8 5v2l8-2.5V19l-2 1.5V22l3.5-1 3.5 1v-1.5L13 19v-5.5z" transform="rotate(90 12 12)"/></svg>';
const GROUP_IDS = {a: ['jonas', 'patrick', 'simon', 'marco'], b: ['dajo', 'greisel']};
function crewAv(ids) {
  return '<span class="pass-av">' + ids.map(id => { const p = TRIP.crew.find(c => c.id === id) || {name: id};
    return '<span title="' + esc(p.name) + '">' + (p.photo && !PRINT ? '<img src="' + esc(p.photo) + '" alt="' + esc(p.name) + '" loading="lazy">' : esc((p.name || '?')[0])) + '</span>'; }).join('') + '</span>';
}
function renderFlights() {
  const list = TRIP.flights.filter(f => G === 'all' || f.g === 'all' || f.g === G);
  const nB = list.filter(f => f.status === 'booked').length, nC = list.filter(f => f.status === 'check').length, nO = list.filter(f => f.status === 'open').length;
  const tdy = isoToday(), win = TRIP.flightsNote.window, dleft = daysBetween(tdy, win);
  document.getElementById('fl-head').innerHTML =
    '<div class="fl-prog"><div class="row"><span><b class="big">' + (nB + nC) + ' von ' + list.length + '</b> Flügen gebucht</span><span class="note">' + (G === 'all' ? 'alle' : esc(gName(G))) + '</span></div>' +
    '<div class="fl-bar" role="img" aria-label="' + (nB + nC) + ' von ' + list.length + ' gebucht"><i style="width:' + (nB / list.length * 100) + '%"></i><i class="chk" style="width:' + (nC / list.length * 100) + '%"></i></div>' +
    (nO ? '<div class="fl-tip">Noch <b>' + nO + ' offen</b>. ' + (dleft > 0 ? 'Buchen ab ca. <b>19.10.</b> (Dajos Pass), am günstigsten Ende Oktober bis Anfang November: <b>noch ' + dleft + ' Tage</b>.' : 'Das Buchungsfenster ist offen: jetzt buchen!') + '</div>' : '<div class="fl-tip">Alles gebucht 🎉</div>') + '</div>';
  document.getElementById('fl-list').innerHTML = list.map(f => {
    const d = fmtDay(f.date), ids = f.g === 'all' ? GROUP_IDS.a.concat(GROUP_IDS.b) : GROUP_IDS[f.g];
    const whoTxt = f.g === 'all' ? 'alle 6' : gName(f.g);
    const stampTxt = {booked: 'Gebucht', open: 'Offen', check: 'Prüfen'}[f.status];
    let links = '';
    if (f.status === 'open') {
      const n = ids.length, ymd = f.date.slice(2).replace(/-/g, '');
      links = '<div class="pass-links"><a href="https://www.google.com/travel/flights?q=' + encodeURIComponent('Flights from ' + f.from + ' to ' + f.to + ' on ' + f.date + ' for ' + n + ' adults') + '" target="_blank" rel="noopener">🔍 Google Flights</a>' +
        '<a href="https://www.skyscanner.de/transport/fluge/' + f.from.toLowerCase() + '/' + f.to.toLowerCase() + '/' + ymd + '/?adultsv2=' + n + '" target="_blank" rel="noopener">🔍 Skyscanner</a></div>';
    }
    return '<li class="fl-item st-' + f.status + '"><article class="pass" aria-label="Flug ' + esc(f.from + ' nach ' + f.to) + '">' +
      '<div class="pass-top"><span>' + (f.dateText ? esc(f.dateText) : d.wd + ' ' + d.dm + f.date.slice(2, 4)) + '</span><span class="stamp st-' + f.status + '">' + stampTxt + '</span></div>' +
      '<div class="pass-main"><div class="ap"><span class="code' + (f.fromUnsure ? ' uns' : '') + '">' + esc(f.from) + (f.fromUnsure ? '?' : '') + '</span><span class="city">' + esc(f.fromCity) + '</span></div>' +
      '<div class="mid">' + PLANE + '<span class="line"></span>' + (f.via ? '<span class="via">' + (f.via[0] === 'Umstieg' ? '1 Umstieg' : 'über ' + esc(f.via.join(', '))) + '</span>' : '<span class="via">direkt</span>') + '</div>' +
      '<div class="ap to"><span class="code">' + esc(f.to) + '</span><span class="city">' + esc(f.toCity) + '</span></div></div>' +
      '<div class="pass-cut"></div>' +
      '<div class="pass-foot">' + (f.dur ? '<div class="dur"><span class="k">Dauer</span><span class="v">' + esc(f.dur) + '</span></div>' : '') + '<div><span class="k">Zeit</span><span class="v mono' + (f.timeUnsure ? ' uns' : '') + '">' + esc(f.time) + '</span></div>' +
      '<div><span class="k">Preis p. P.</span><span class="v">' + esc(f.price) + '</span></div>' +
      '<div class="who"><span class="k">Wer · ' + esc(whoTxt) + '</span>' + crewAv(ids) + '</div></div>' +
      '<div class="pass-state st-' + f.status + '">' + (f.status === 'booked' ? '✅ ' : f.status === 'open' ? '⏳ ' : '🟡 ') + esc(f.statusText) + '</div>' +
      (f.warn ? '<div class="pass-warn">⚠️ ' + esc(f.warn) + '</div>' : '') +
      (f.note ? '<p class="pass-note">' + esc(f.note) + '</p>' : '') + links + '</article></li>';
  }).join('');
  document.getElementById('fl-note').textContent = TRIP.flightsNote.text;
}

/* ---------- Kosten ---------- */
function renderCosts() {
  const eur = v => v.toLocaleString('de-DE') + ' €';
  const box = g => {
    const rows = TRIP.costs.filter(c => c[g]).map(c => ({label: c.label, ...c[g]}));
    const fix = rows.filter(r => r.k === 'fix').reduce((s, r) => s + r.v, 0), ca = rows.filter(r => r.k === 'ca').reduce((s, r) => s + r.v, 0);
    const open = rows.filter(r => r.k === 'open' || r.k === 'split').length, tot = fix + ca;
    return '<div class="co"><div class="co-sum"><span class="grp">' + esc(gName(g)) + ' · bekannte Posten</span><b>ca. ' + eur(Math.round(tot / 10) * 10) + '</b></div>' +
      '<div class="co-bar" role="img" aria-label="' + eur(fix) + ' fest, ' + eur(ca) + ' geschätzt"><i class="fix" style="width:' + (fix / tot * 100) + '%"></i><i class="ca" style="width:' + (ca / tot * 100) + '%"></i></div>' +
      '<div class="co-leg"><span><i style="background:var(--ok)"></i>fest ' + eur(fix) + '</span><span><i style="background:var(--amarelo)"></i>geschätzt ' + eur(ca) + '</span>' + (open ? '<span>+ ' + open + ' Posten noch offen</span>' : '') + '</div>' +
      '<ul class="co-list">' + rows.map(r => '<li><span>' + esc(r.label) + '</span><span class="v ' + r.k + '">' +
        (r.k === 'open' ? 'offen' : r.k === 'split' ? esc(r.t) : (r.k === 'ca' ? 'ca. ' : '') + eur(r.v)) + '</span></li>').join('') + '</ul></div>';
  };
  document.getElementById('co-box').innerHTML = G === 'all' ? box('a') + box('b') : box(G);
}

function setGroup(g) {
  G = g; if (!PRINT) store.set('group', g);
  document.querySelectorAll('.seg button').forEach(b => b.setAttribute('aria-pressed', String(b.dataset.g === g)));
  renderToday(); renderDays(); renderFlights(); renderCosts();
}
document.querySelectorAll('.seg button').forEach(b => b.addEventListener('click', () => setGroup(b.dataset.g)));

/* ---------- Packlisten (nur auf diesem Geraet) ---------- */
document.querySelectorAll('ul.pack2').forEach(ul => {
  const key = 'pack.' + ul.dataset.list;
  let saved = {}; try { saved = JSON.parse(store.get(key) || '{}'); } catch (e) {}
  [...ul.children].forEach((li, i) => {
    const id = 'pk-' + ul.dataset.list + '-' + i;
    li.innerHTML = '<label for="' + id + '"><input type="checkbox" id="' + id + '"' + (saved[i] ? ' checked' : '') + '><span>' + li.innerHTML + '</span></label>';
  });
  ul.addEventListener('change', e => {
    const i = [...ul.querySelectorAll('input')].indexOf(e.target);
    saved[i] = e.target.checked; store.set(key, JSON.stringify(saved));
  });
});

/* ---------- Google-Kalender-Links ---------- */
function gcalLink(ev, fallbackDate) {
  let dates;
  if (ev.start) dates = ev.start + '/' + ev.end;
  else {
    const d = dateObj(fallbackDate); d.setUTCDate(d.getUTCDate() + 1);
    dates = ev.date + '/' + d.toISOString().slice(0, 10).replace(/-/g, '');
  }
  return 'https://calendar.google.com/calendar/render?action=TEMPLATE&text=' + encodeURIComponent(ev.summary) +
    '&dates=' + dates + '&details=' + encodeURIComponent((ev.desc || '') + '\nBrasilien 26/27');
}
document.getElementById('gcal').innerHTML = TRIP.days.flatMap(d => d.items.filter(i => i.ics && /✈|🛬/.test(i.ics.summary)).map(i => {
  const f = fmtDay(d.date);
  return '<li><a href="' + esc(gcalLink(i.ics, d.date)) + '" target="_blank" rel="noopener">' + f.dm + ' ' + esc(i.ics.summary.replace(/^\S+\s/, '')) + '</a></li>';
})).join('');

/* ---------- PDF ---------- */
(async () => {
  const btn = document.getElementById('pdf-btn');
  const dl = window.claude && window.claude.use ? await window.claude.use('downloads') : null;
  if (!dl) { btn.hidden = true; return; }
  btn.addEventListener('click', async () => {
    try {
      const res = await fetch('brasilien-reise.pdf');
      if (!res.ok) throw new Error('fetch');
      await dl.save({filename: 'Brasilien-26-27.pdf', data: await res.blob()});
    } catch (e) {
      if (!(e && e.code === 'declined')) btn.insertAdjacentHTML('afterend', ' <span class="note">Ging nicht, bitte den GitHub-Link nehmen.</span>');
    }
  });
})();

/* ---------- WhatsApp-Kurzfassung ---------- */
function renderWhatsApp() {
  const txt = [
    '🇧🇷 Brasilien 26/27, Stand 30.09.',
    '',
    '27.–31.12. Guarujá, Casa Praiana ✅',
    '31.12.–06.01. Rio, Tabas – Cena Carioca ✅ (ab Silvester, in Weiß!)',
    '06.–09.01. Foz do Iguaçu 🟡 Hotelname prüfen',
    '09.–14.01. Manaus + Juma Lodge ✅',
    '14.–16.01. Paraty, Geko Pousada ✅',
    '16.–20./21.01. Ilha Grande ❗ Unterkunft offen',
    '',
    'Noch zu buchen:\n• Inlandsflüge (31.12., 06.01., 09.01., 14.01.)\n• Unterkunft Ilha Grande',
    '',
    'Alles mit Karte, Tagen und Drinks: https://claude.ai/artifact/3MHzcPCtQJY7Kx5XUHDGZE'
  ].join('\n');
  document.getElementById('wa-text').textContent = txt;
}
document.getElementById('wa-copy').addEventListener('click', () => {
  const txt = document.getElementById('wa-text').textContent;
  const done = () => { document.getElementById('wa-status').textContent = 'Kopiert.'; };
  const fallback = () => {
    const r = document.createRange(); r.selectNodeContents(document.getElementById('wa-text'));
    const s = getSelection(); s.removeAllRanges(); s.addRange(r);
    document.getElementById('wa-status').textContent = 'Text ist markiert, jetzt kopieren.';
  };
  try { navigator.clipboard.writeText(txt).then(done, fallback); } catch (e) { fallback(); }
});

/* ---------- Sprachfuehrer mit Sprachausgabe ---------- */
(function () {
  const box = document.getElementById('phrases');
  box.innerHTML = TRIP.phrases.map((c, ci) => '<div class="pcat"><h3>' + esc(c.cat) + '</h3>' +
    c.items.map((p, pi) => '<div class="phr"><div class="txt"><div class="de">' + esc(p.de) + '</div><div class="pt" lang="pt-BR">' + esc(p.pt) +
      '</div><div class="say">' + esc(p.say) + '</div></div>' +
      '<button type="button" class="play" data-c="' + ci + '" data-p="' + pi + '" aria-label="Vorsprechen: ' + esc(p.pt) + '">▶</button></div>').join('') +
    '</div>').join('');
  const st = document.getElementById('speak-status');
  const slow = document.getElementById('speak-slow');
  const dev = document.getElementById('speak-device');
  if (store.get('slow') === '0') slow.checked = false;
  slow.addEventListener('change', () => store.set('slow', slow.checked ? '1' : '0'));

  const synth = window.speechSynthesis && typeof SpeechSynthesisUtterance !== 'undefined' ? window.speechSynthesis : null;
  let voice = null;
  const pick = () => {
    const vs = synth.getVoices();
    voice = vs.find(v => /^pt[-_]BR/i.test(v.lang)) || vs.find(v => /^pt/i.test(v.lang)) || null;
    document.getElementById('speak-device-wrap').hidden = !voice;
  };
  if (synth) { pick(); if (synth.addEventListener) synth.addEventListener('voiceschanged', pick); }
  if (store.get('device') === '1') dev.checked = true;
  dev.addEventListener('change', () => store.set('device', dev.checked ? '1' : '0'));

  let audio = null, current = null;
  const done = () => { if (current) current.classList.remove('on'); current = null; };
  function speakDevice(p) {
    synth.cancel();
    const de = new SpeechSynthesisUtterance(p.de.replace(/\s*\([^)]*\)/g, '').replace(/…/g, ''));
    de.lang = 'de-DE'; de.rate = slow.checked ? 0.85 : 1;
    const vde = synth.getVoices().find(v => /^de[-_]/i.test(v.lang)); if (vde) de.voice = vde;
    const u = new SpeechSynthesisUtterance(p.pt.replace(/…/g, ''));
    u.lang = 'pt-BR'; if (voice) u.voice = voice;
    u.rate = slow.checked ? 0.75 : 1;
    u.onend = u.onerror = done;
    synth.speak(de); synth.speak(u);
  }
  box.addEventListener('click', e => {
    const b = e.target.closest('.play'); if (!b) return;
    const p = TRIP.phrases[+b.dataset.c].items[+b.dataset.p];
    if (audio) audio.pause();
    if (synth) synth.cancel();
    done(); current = b; b.classList.add('on'); st.textContent = '';
    if (dev.checked && synth && voice) { speakDevice(p); return; }
    audio = new Audio(p.audio);
    audio.playbackRate = slow.checked ? 0.8 : 1;
    audio.onended = done;
    audio.onerror = () => {
      done();
      if (synth) { current = b; b.classList.add('on'); speakDevice(p); }
      else st.textContent = 'Die Aufnahme konnte nicht geladen werden.';
    };
    audio.play().catch(err => { if (err && err.name !== 'AbortError') audio.onerror(); });
  });
})();

/* ---------- Crew ---------- */
(function () {
  const el = document.getElementById('crew-list');
  el.innerHTML = TRIP.crew.map(p => {
    const full = !!(p.facts && p.facts.length);
    const pic = p.photo && !PRINT ? '<button type="button" class="zoom" data-id="' + esc(p.id) + '" aria-label="Foto von ' + esc(p.name) + ' vergrößern"><img src="' + esc(p.photo) + '" alt="Foto von ' + esc(p.name) + '" loading="lazy"></button>' : esc(p.name[0]);
    let h = '<article class="pcard' + (full ? ' full' : '') + '" id="crew-' + esc(p.id) + '"><div class="avatar">' + pic + '</div><div>';
    h += '<h3>' + esc(p.name) + (p.nick ? '<span class="nick">' + esc(p.nick) + '</span>' : '') + '</h3>';
    if (p.role) h += '<span class="role">' + esc(p.role) + '</span>';
    if (full) h += '<dl>' + p.facts.map(f => '<dt>' + esc(f[0]) + '</dt><dd>' + esc(f[1]) + '</dd>').join('') + '</dl>';
    if (p.quote) h += '<blockquote>„' + esc(p.quote) + '“</blockquote>';
    if (!full) h += '<div class="team">' + esc(gName(p.team)) + '</div><div class="soon">Steckbrief folgt</div>';
    return h + '</div></article>';
  }).join('');

  const short = r => (r || '').split(/ & |\. /)[0].replace(/\.$/, '');
  document.getElementById('crew-overview').innerHTML = ['a', 'b'].map(g =>
    '<div class="grp ' + g + '"><h3>' + esc(gName(g)) + '</h3><div class="row">' +
    TRIP.crew.filter(p => p.team === g).map(p =>
      '<a href="#crew-' + esc(p.id) + '"><span class="av">' +
      (p.photo && !PRINT ? '<img src="' + esc(p.photo) + '" alt="" loading="lazy">' : esc(p.name[0])) +
      '</span><b>' + esc(p.name) + '</b><small>' + esc(short(p.role)) + '</small></a>').join('') +
    '</div></div>').join('');

  const lb = document.getElementById('lightbox'), lbImg = document.getElementById('lightbox-img');
  let lastFocus = null;
  function open(p) {
    lastFocus = document.activeElement;
    lbImg.src = p.photoLarge || p.photo; lbImg.alt = 'Foto von ' + p.name;
    document.getElementById('lightbox-cap').textContent = p.name + (p.role ? ' · ' + p.role : '');
    lb.hidden = false; document.body.style.overflow = 'hidden';
    document.getElementById('lightbox-close').focus();
  }
  function close() {
    if (lb.hidden) return;
    lb.hidden = true; document.body.style.overflow = '';

  const grams = d => d.ml * d.abv / 100 * 0.789;
  const dayOf = ts => new Intl.DateTimeFormat('en-CA', {timeZone: TZ, year: 'numeric', month: '2-digit', day: '2-digit'}).format(new Date(ts));
  const timeOf = ts => new Intl.DateTimeFormat('de-DE', {timeZone: TZ, hour: '2-digit', minute: '2-digit'}).format(new Date(ts));

  let drinks = [];            // [{id, who, cat, name, ml, abv, ts}]

  /* --- Promille nach Widmark: Summe der Getraenke minus Abbau --- */
  const BETA = 0.15; // Promille pro Stunde

    const sex = o.sex || d[0], kg = +o.kg || d[1];
    return {sex, kg, r: sex === 'w' ? 0.55 : 0.68};
  }
  function bacTimeline(id) {                // liefert Funktion t -> Promille und Tages-Peaks
    const b = bodyOf(id), list = drinks.filter(d => d.who === id).sort((a, z) => a.ts - z.ts);
    let bac = 0, last = null; const peaks = {}; const pts = [];
    for (const d of list) {
      if (last !== null) bac = Math.max(0, bac - BETA * (d.ts - last) / 36e5);
      bac += grams(d) / (b.kg * b.r);
      last = d.ts; pts.push([d.ts, bac]);

/* ---------- Karte: Fortschritt, "Hier sind wir", Check-ins (db-Collection "checkins") ---------- */
(function () {
  const svg = document.querySelector('#route svg.tripmap'); if (!svg) return;
  const [LON0, LAT0, K, COS, ILON0, ILON1, ILAT0, ILAT1, IX, IY, IK, ICOS] = svg.dataset.proj.split(',').map(Number);
  const xy = (lat, lon) => (lon >= ILON0 && lon <= ILON1 && lat <= ILAT0 && lat >= ILAT1)
    ? [IX + (lon - ILON0) * IK * ICOS, IY + (ILAT0 - lat) * IK]
    : [(lon - LON0) * K * COS, (LAT0 - lat) * K];
  const $ = id => document.getElementById(id);
  const NS = 'http://www.w3.org/2000/svg';
  const mk = (tag, attrs) => { const e = document.createElementNS(NS, tag); for (const k in attrs) e.setAttribute(k, attrs[k]); return e; };
  let checkins = [], dbc = null, canCheck = false;

  function progress() {
    const t = isoToday();
    svg.querySelectorAll('[data-d]').forEach(p => p.classList.toggle('done', p.dataset.d <= t));
    let here = null;
    svg.querySelectorAll('.stopg').forEach(g => {
      const on = g.dataset.from <= t && t <= g.dataset.to;
      g.classList.toggle('here', on); g.classList.toggle('past', g.dataset.to < t);
      if (on) here = g.querySelector('.lbl').textContent;
    });
    const last = checkins[0];
    let txt;
    if (last) txt = '📍 Zuletzt eingecheckt: ' + (last.label || 'ohne Ortsname') + ', ' + fmtDay(new Date(last.ts).toISOString().slice(0, 10)).dm + ' ' + new Intl.DateTimeFormat('de-DE', {timeZone: TZ, hour: '2-digit', minute: '2-digit'}).format(new Date(last.ts));
    else if (here) txt = '📍 Hier sind wir laut Plan: ' + here;
    else if (t < '2026-12-27') txt = '🏠 Noch zu Hause. Abflug am 27.12.';
    else if (t > '2027-01-21') txt = '🏁 Reise geschafft.';
    else txt = '✈ Unterwegs.';
    $('here-text').textContent = txt;
    const a = $('here-gmaps');
    if (last) { a.href = 'https://www.google.com/maps/search/?api=1&query=' + last.lat + ',' + last.lon; a.hidden = false; }
    else if (here) { a.href = 'https://www.google.com/maps/search/?api=1&query=' + encodeURIComponent(here + ', Brasil'); a.hidden = false; }
    else a.hidden = true;
  }
  function drawPins() {
    const g = svg.querySelector('#map-pins'); g.innerHTML = '';
    const list = checkins.slice(0, 40).slice().reverse();
    if (list.length > 1) g.appendChild(mk('polyline', {class: 'pin-trail', points: list.map(c => xy(c.lat, c.lon).map(v => v.toFixed(1)).join(',')).join(' ')}));
    list.forEach((c, i) => {
      const [x, y] = xy(c.lat, c.lon), last = i === list.length - 1;
      g.appendChild(mk('circle', {class: last ? 'pin' : 'pin-old', cx: x, cy: y, r: last ? 9 : 5}));
      if (last && c.label) {
        const W = svg.viewBox.baseVal.width, right = x > W - 160;
        const tx = mk('text', {class: 'pin-lbl', x: right ? x - 13 : x + 13, y: y + 24, 'text-anchor': right ? 'end' : 'start'});
        tx.textContent = c.label; g.appendChild(tx);

  }
  function renderList() {
    $('ci-list').innerHTML = checkins.slice(0, 30).map(c => '<li data-id="' + esc(c.id) + '"><span class="t">' + fmtDay(new Date(c.ts).toISOString().slice(0, 10)).dm + ' ' +
      new Intl.DateTimeFormat('de-DE', {timeZone: TZ, hour: '2-digit', minute: '2-digit'}).format(new Date(c.ts)) + '</span><span>' + esc(c.label || '–') +
      ' <a href="https://www.google.com/maps/search/?api=1&query=' + c.lat + ',' + c.lon + '" target="_blank" rel="noopener">' + c.lat.toFixed(4) + ', ' + c.lon.toFixed(4) + '</a></span>' +
      (canCheck ? '<button type="button" class="del" aria-label="Check-in löschen">×</button>' : '<span></span>') + '</li>').join('');
  }
  function parseCoords(s) {
    s = String(s || '').replace(/−/g, '-');
    const m = s.match(/@(-?\d+(?:\.\d+)?),\s*(-?\d+(?:\.\d+)?)/) || s.match(/(-?\d{1,2}(?:[.,]\d+)?)\s*[,; ]\s*(-?\d{1,3}(?:[.,]\d+)?)/);
    if (!m) return null;
    const lat = parseFloat(m[1].replace(',', '.')), lon = parseFloat(m[2].replace(',', '.'));
    if (!(Math.abs(lat) <= 90 && Math.abs(lon) <= 180)) return null;

    renderList();

    if (c.lat > 10 || c.lat < -40 || c.lon < -80 || c.lon > -25) { $('ci-status').textContent = 'Die Koordinaten liegen nicht in Südamerika. Breite und Länge vertauscht?'; return; }
    try {
      await dbc.collection('checkins').doc().set({lat: c.lat, lon: c.lon, label: $('ci-label').value.trim().slice(0, 60), ts: Date.now()});
      $('ci-coords').value = ''; $('ci-label').value = '';
      $('ci-status').textContent = 'Eingecheckt ✅';
    } catch (e) {
      if (e && (e.code === 'invalid_argument' || e.code === 'not_granted')) lock(true); else $('ci-status').textContent = 'Hat nicht geklappt, bitte nochmal.';
    }
  });
  $('ci-list').addEventListener('click', async e => {
    const b = e.target.closest('.del'); if (!b || !dbc) return;
    try { await dbc.doc('checkins/' + b.closest('li').dataset.id).delete(); } catch (err) { $('ci-status').textContent = 'Konnte nicht löschen.'; }
  });

  lock(true); progress();
  if (PRINT) return;
  setInterval(progress, 10 * 60000);
  (async () => {
    if (!window.claude || !window.claude.use) return;
    dbc = await window.claude.use('db'); if (!dbc) return;
    const user = await window.claude.use('user');
    const w = user ? await user.can('data.write') : null;
    lock(w === false);
    dbc.collection('checkins').onSnapshot(snap => {
      checkins = snap.docs.filter(d => d.exists).map(d => Object.assign({id: d.id}, d.data()))
        .filter(c => typeof c.lat === 'number' && typeof c.lon === 'number' && typeof c.ts === 'number').sort((a, b) => b.ts - a.ts);
      drawPins(); renderList(); progress();
    }, () => {});
  })();
})();

/* Real-Rechner mit lustigen Vergleichen */
(function () {
  const M = TRIP.money; if (!M || !document.getElementById('fx-amount')) return;
  const $ = id => document.getElementById(id);
  const amt = $('fx-amount'), rateIn = $('fx-rate');
  let dir = store.get('fx.dir') === 'eur' ? 'eur' : 'brl';
  let rate = parseFloat(store.get('fx.rate')) || M.rate;
  const num = (v, d) => v.toLocaleString('de-DE', {minimumFractionDigits: d, maximumFractionDigits: d});
  const money = (v, cur) => cur === '€' ? num(v, 2) + ' €' : 'R$ ' + num(v, 2);
  const count = n => n >= 100 ? num(Math.round(n), 0) : n >= 10 ? num(Math.round(n * 10) / 10, n % 1 ? 1 : 0)
    : n >= 0.1 ? num(Math.round(n * 10) / 10, 1).replace(/,0$/, '') : n.toLocaleString('de-DE', {maximumSignificantDigits: 2});
  let deck = [], last = null;
  function pick(brl) {
    const ok = M.compare.filter(c => c.always ? brl > 0 : brl / c.brl >= 0.5 && brl / c.brl <= 400);
    if (!ok.length) return '';
    deck = deck.filter(c => ok.includes(c));
    if (!deck.length) deck = ok.slice().sort(() => Math.random() - 0.5);
    let c = deck.shift();
    if (c === last && deck.length) { deck.push(c); c = deck.shift(); }
    last = c;
    return 'Das sind ' + c.t.replace('{n}', count(brl / c.brl));
  }
  function render(newJoke) {
    const v = Math.max(0, parseFloat(String(amt.value).replace(',', '.')) || 0);
    const brl = dir === 'brl' ? v : v * rate, eur = dir === 'brl' ? v / rate : v;
    $('fx-cur').textContent = dir === 'brl' ? 'R$' : '€';
    $('fx-res').textContent = dir === 'brl' ? money(v, 'R$') + ' = ' + money(eur, '€') : money(v, '€') + ' = ' + money(brl, 'R$');
    if (newJoke) {
      const j = $('fx-joke'); j.classList.add('fade');
      setTimeout(() => { j.textContent = brl > 0 ? pick(brl) : 'Nix eingetippt, nix getrunken. 🙃'; j.classList.remove('fade'); }, reduceMotionFx ? 0 : 180);
    }
    document.querySelectorAll('.fx-dir button').forEach(b => b.setAttribute('aria-pressed', b.dataset.dir === dir));
  }
  const reduceMotionFx = window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches;
  $('fx-quick').innerHTML = M.quick.map(q => '<button type="button" data-v="' + q + '">' + q + '</button>').join('');
  $('fx-quick').addEventListener('click', e => { const b = e.target.closest('button'); if (!b) return; amt.value = b.dataset.v; render(true); });
  document.querySelector('.fx-dir').addEventListener('click', e => {
    const b = e.target.closest('button'); if (!b || b.dataset.dir === dir) return;
    const v = parseFloat(amt.value) || 0;
    amt.value = Math.round((dir === 'brl' ? v / rate : v * rate) * 100) / 100;
    dir = b.dataset.dir; store.set('fx.dir', dir); render(true);
  });
  let t; amt.addEventListener('input', () => { render(false); clearTimeout(t); t = setTimeout(() => render(true), 450); });
  $('fx-more').addEventListener('click', () => render(true));
  rateIn.value = rate;
  rateIn.addEventListener('input', () => { const r = parseFloat(String(rateIn.value).replace(',', '.')); if (r > 0) { rate = r; store.set('fx.rate', r); render(false); } });
  $('fx-note').textContent = 'Kurs: ' + M.rateNote + '. Eigenen Kurs oben eintragen, er wird auf diesem Handy gespeichert. Vergleiche mit groben Richtpreisen, alle Angaben ohne Gewähr, Promille-Garantie keine.';
  if (dir === 'eur') amt.value = Math.round(50 / rate);
  render(true);
})();

  function winners(q) {
    const s = sol[q.id]; if (s === undefined || s === '' || q.type === 'text') return [];
    const ent = CREW.filter(p => tips[p.id] && tips[p.id].a[q.id] !== undefined && tips[p.id].a[q.id] !== '');
    if (q.type === 'number') {
      const diffs = ent.map(p => Math.abs(Number(tips[p.id].a[q.id]) - Number(s))); const m = Math.min(...diffs);
      return ent.filter((p, i) => diffs[i] === m).map(p => p.id);
    }
    return ent.filter(p => tips[p.id].a[q.id] === s).map(p => p.id);
  }
  function solInput(q) {
    const s = sol[q.id];
    if (q.type === 'text' || !writable) return s !== undefined && q.type !== 'text' ? '<div class="ka-sol">Auflösung: <b>' + esc(fmtAns(q, s)) + '</b></div>' : '';
    let f;
    if (q.type === 'crew') f = '<select data-s="' + q.id + '"><option value="">–</option>' + CREW.map(p => '<option value="' + p.id + '"' + (s === p.id ? ' selected' : '') + '>' + esc(p.name) + '</option>').join('') + '</select>';
    else if (q.type === 'choice') f = '<select data-s="' + q.id + '"><option value="">–</option>' + q.options.map(o => '<option' + (s === o ? ' selected' : '') + '>' + esc(o) + '</option>').join('') + '</select>';
    else if (q.type === 'yesno') f = '<select data-s="' + q.id + '"><option value="">–</option><option value="1"' + (s === true ? ' selected' : '') + '>Ja</option><option value="0"' + (s === false ? ' selected' : '') + '>Nein</option></select>';
    else f = '<input type="number" data-s="' + q.id + '" value="' + (s ?? '') + '" style="width:6rem"> ' + esc(q.unit || '');
    return '<div class="ka-sol">Auflösung (Admin): ' + f + '</div>';
  }
  function renderOpen() {
    const pts = Object.fromEntries(CREW.map(p => [p.id, 0]));
    Q.forEach(q => winners(q).forEach(id => pts[id]++));
    const ranked = CREW.filter(p => tips[p.id]).sort((a, b) => pts[b.id] - pts[a.id]);
    const anySol = Object.keys(sol).length > 0;
    let h = '<div class="ka-seal"><div class="big">🎉 Die Zeitkapsel ist offen!</div><div class="when">' + Object.keys(tips).length + ' von ' + CREW.length + ' haben getippt. ' + (writable ? 'Trag unten die Auflösungen ein, dann steht der Hellseher der Reise fest.' : 'Die Auflösung trägt Patrick ein.') + '</div></div>';
    if (anySol && ranked.length) h += '<div class="ka-rank"><h3>🔮 Hellseher der Reise</h3><ol>' + ranked.map(p => '<li>' + esc(p.name) + ': <b>' + pts[p.id] + '</b> ' + (pts[p.id] === 1 ? 'Treffer' : 'Treffer') + '</li>').join('') + '</ol></div>';
    h += Q.map(q => { const w = winners(q);
      return '<div class="ka-res"><h3>' + q.emoji + ' ' + esc(q.q) + '</h3><ul class="ka-ans">' + CREW.filter(p => tips[p.id]).map(p =>
        '<li class="' + (w.includes(p.id) ? 'win' : '') + '">' + av(p) + '<span><b>' + esc(p.name) + ':</b> ' + esc(fmtAns(q, tips[p.id].a[q.id])) + '</span></li>').join('') + '</ul>' + solInput(q) + '</div>'; }).join('');
    box.innerHTML = h;
  }
  function render() { (isOpen() ? renderOpen : renderSealed)(); }
  box.addEventListener('click', async e => {
    const p = e.target.closest('[data-p]'); if (p && writable) { who = p.dataset.p; draft = {}; msg = ''; render(); return; }
    const yn = e.target.closest('.ka-yn button'); if (yn && writable) { const qid = yn.parentElement.dataset.q; draft[qid] = yn.dataset.v === '1'; yn.parentElement.querySelectorAll('button').forEach(b => b.setAttribute('aria-pressed', b === yn)); return; }
    if (e.target.id === 'ka-wa') {
      const txt = waText(), out = document.getElementById('ka-wa-msg');
      try { await navigator.clipboard.writeText(txt); out.textContent = 'Kopiert, jetzt in WhatsApp einfügen.'; }
      catch (err) { out.textContent = ''; const pre = document.createElement('pre'); pre.className = 'wa'; pre.textContent = txt; e.target.parentElement.after(pre); }
      return;
    }
    if (e.target.id === 'ka-save' && writable && who && dbK) {
      const a = {}; Object.entries(draft).forEach(([k, v]) => { if (v !== '' && v !== undefined && v !== null) a[k] = v; });
      const cnt = Object.keys(a).length;
      if (!cnt) { msg = 'Noch keine Antwort ausgefüllt.'; document.getElementById('ka-msg').textContent = msg; return; }
      e.target.disabled = true; document.getElementById('ka-msg').textContent = 'Versiegle …';
      try { await dbK.doc('kapsel/' + who).set({a, ts: Date.now()}); justSealed = who; who = null; draft = {}; msg = ''; }
      catch (err) { msg = err && err.code === 'not_granted' ? 'Keine Schreibrechte.' : 'Konnte nicht speichern, bitte nochmal.'; e.target.disabled = false; }
      render();
    }
  });
  box.addEventListener('input', e => {
    const q = e.target.dataset.q; if (q) { const def = Q.find(x => x.id === q); draft[q] = def.type === 'number' ? (e.target.value === '' ? '' : Number(e.target.value)) : e.target.value; }
  });
  box.addEventListener('change', async e => {
    const q = e.target.dataset.s; if (!q || !writable || !dbK) return;
    const def = Q.find(x => x.id === q); let v = e.target.value;
    if (v === '') { delete sol[q]; } else sol[q] = def.type === 'number' ? Number(v) : def.type === 'yesno' ? v === '1' : v;
    try { await dbK.doc('kapselres/solution').set({s: sol}); } catch (err) {}
    render();
  });
  render();
  setInterval(() => { if (!box.contains(document.activeElement)) render(); }, 60000);
  (async () => {
    if (!window.claude || !window.claude.use) return;
    dbK = await window.claude.use('db'); if (!dbK) return;
    const user = await window.claude.use('user');
    const w = user ? await user.can('data.write') : null; writable = w !== false; render();
    dbK.collection('kapsel').onSnapshot(snap => {
      tips = {}; snap.docs.forEach(d => { if (d.exists && byId[d.id]) { const x = d.data(); if (x && x.a) tips[d.id] = x; } });
      if (!box.contains(document.activeElement) || isOpen()) render(); else { const w2 = box.querySelector('.ka-seal'); if (w2) { const n = document.createElement('div'); n.innerHTML = whoRow(); w2.querySelector('.ka-who').replaceWith(n.firstChild); } }
    }, () => {});
    dbK.collection('kapselres').onSnapshot(snap => { snap.docs.forEach(d => { if (d.exists && d.id === 'solution') sol = Object.assign({}, (d.data() || {}).s); }); if (isOpen()) render(); }, () => {});
  })();
})();

const TAB_IDS = [...document.querySelectorAll('.tabs a')].map(a => a.dataset.tab);
const SECTIONS = [...document.querySelectorAll('section[data-tab]')];
const reduceMotion = window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches;
function barHeight() { const bar = document.querySelector('.tabs'); return bar ? bar.offsetHeight : 0; }
function targetFor(id) {
  if (TAB_IDS.includes(id)) return SECTIONS.find(s => s.dataset.tab === id);
  return id ? document.getElementById(id) : null;
}
function jump(id, smooth) {
  const el = targetFor(id); if (!el) return false;
  const y = el.getBoundingClientRect().top + scrollY - barHeight() - 10;
  scrollTo({top: Math.max(0, y), behavior: smooth && !reduceMotion ? 'smooth' : 'auto'});
  return true;
}
let activeTab = null;
function markTab(tab) {
  if (tab === activeTab) return;
  activeTab = tab;
  document.querySelectorAll('.tabs a').forEach(a => {
    const on = a.dataset.tab === tab;
    a.setAttribute('aria-selected', String(on));
    if (on) a.setAttribute('aria-current', 'location'); else a.removeAttribute('aria-current');
    if (on) { const bar = a.parentElement; bar.scrollTo({left: a.offsetLeft - bar.clientWidth / 2 + a.offsetWidth / 2, behavior: 'auto'}); }
  });
}
function spy() {
  const line = barHeight() + 40;
  let cur = SECTIONS[0];
  for (const s of SECTIONS) { if (s.getBoundingClientRect().top <= line) cur = s; else break; }
  markTab(cur.dataset.tab);
}
if (!PRINT) {
  document.addEventListener('click', e => {
    const a = e.target.closest('a[href^="#"]'); if (!a) return;
    const id = a.getAttribute('href').slice(1);
    if (!targetFor(id)) return;
    e.preventDefault();
    try { history.replaceState(null, '', '#' + id); } catch (err) {}
    jump(id, true);
  });
  let ticking = false;
  addEventListener('scroll', () => { if (!ticking) { ticking = true; requestAnimationFrame(() => { spy(); ticking = false; }); } }, {passive: true});
  addEventListener('hashchange', () => jump(location.hash.slice(1), true));
  spy();
  if (location.hash.length > 1) setTimeout(() => jump(location.hash.slice(1), false), 50);
}

/* ---------- Start ---------- */
setGroup(G);
renderWhatsApp();
</script>
