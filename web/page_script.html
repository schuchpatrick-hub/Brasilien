<script>
/* TRIP wird von tools/build.py aus web/trip.json eingesetzt. */
const TRIP = %%TRIP%%;
const TZ = 'America/Sao_Paulo';
const PEOPLE = ['Jonas', 'Patrick', 'Simon', 'Marco', 'Daijo', 'Greisel', 'Alle'];
const PRINT = location.hash === '#print';
/* Schwächere Geräte: Glas-Effekte (backdrop-filter) und Animationen sparen */
try { if ((navigator.deviceMemory && navigator.deviceMemory <= 4) || (navigator.hardwareConcurrency && navigator.hardwareConcurrency <= 4) ||
  (window.matchMedia && matchMedia('(prefers-reduced-transparency: reduce)').matches)) document.documentElement.classList.add('lite'); } catch (e) {}

const store = {
  get(k) { try { return localStorage.getItem('br26.' + k); } catch (e) { return null; } },
  set(k, v) { try { localStorage.setItem('br26.' + k, v); } catch (e) {} }
};
// allererster Besuch auf diesem Gerät (vor allen anderen Modulen gemessen, die gleich selbst etwas speichern)
const FIRST_VISIT = (() => { try { return !Object.keys(localStorage).some(k => k.indexOf('br26.') === 0); } catch (e) { return false; } })();
/* ---------- „Ich bin …“: persönliche Ansicht (nur auf diesem Gerät) ----------
   Module melden ihre Werte für alle Personen über meSet(); renderMe() zeigt den Kasten für die gewählte Person. */
let ME = TRIP.crew.some(c => c.id === store.get('me')) ? store.get('me') : null;
const MEHUB = {};
function meSet(k, v) { MEHUB[k] = v; renderMe(); }
function meMoney(v) { return v >= 1e6 ? (Math.round(v / 1e5) / 10).toLocaleString('de-DE', {minimumFractionDigits: 1}) + ' Mio. €' : Math.round(v / 1e4) * 10 + ' Tsd. €'; }
function meMark() {
  document.querySelectorAll('.pcard.me, .fc.me').forEach(e => e.classList.remove('me'));
  if (!ME) return;
  const a = document.getElementById('crew-' + ME), b = document.getElementById('fc-' + ME);
  if (a) a.classList.add('me'); if (b) b.classList.add('me');
}
function renderMe() {
  const box = document.getElementById('me-box'); if (!box || PRINT) return;
  const crew = TRIP.crew, av = p => '<span class="me-av">' + (p.photo ? '<img src="' + esc(p.photo) + '" alt="" loading="lazy">' : esc(p.name[0])) + '</span>';
  if (!ME) {
    box.innerHTML = store.get('meSkip') === '1' ? '<button type="button" class="me-link" data-me-open>👤 Ich bin …</button>' :
      '<div class="me-pick"><span class="me-q">👋 Wer bist du? <small>Dann zeigt die Seite deine eigenen Werte.</small></span><div class="me-row">' +
      crew.map(p => '<button type="button" data-me="' + esc(p.id) + '">' + av(p) + esc(p.name) + '</button>').join('') + '</div><button type="button" class="me-link" data-me-skip>Später</button></div>';
    return;
  }
  const p = crew.find(c => c.id === ME), d = (MEHUB.drinks || {})[ME], c = (MEHUB.card || {})[ME], k = (MEHUB.kapsel || {})[ME];
  const chips = [];
  if (d) chips.push('🍻 heute <b>' + d.today + '</b> · gesamt <b>' + d.total + '</b>' + (d.total ? ' (Platz ' + d.rank + ')' : ''));
  if (c) {
    chips.push('⚽ Gesamt <b>' + c.ovr + '</b> · Platz ' + c.pos + ' von ' + crew.length);
    chips.push('💰 <b>' + meMoney(c.mv) + '</b> <span class="' + (c.chg >= 0 ? 'up' : 'dn') + '">' + (c.chg >= 0 ? '▲' : '▼') + ' ' + Math.abs(c.chg * 100).toLocaleString('de-DE', {maximumFractionDigits: 1}) + ' %</span>');
    if (c.w || c.l) chips.push('🏆 <b>' + c.w + '</b> Siege · ' + c.l + '× Letzter');
  }
  if (k !== undefined) chips.push(k ? '⏳ Zeitkapsel: getippt ✅' : '⏳ Zeitkapsel: <b>noch offen</b>');
  if (store.get('meOpen') !== '1') { box.innerHTML = '<button type="button" class="me-mini" data-me-tog aria-expanded="false">' + av(p) + '<span>' + esc(p.name) + '</span>' + (chips.length ? '<small>' + chips[0].replace(/<[^>]+>/g, '') + '</small>' : '') + '<i aria-hidden="true">▾</i></button>'; return; }
  box.innerHTML = '<div class="me-card"><div class="me-head">' + av(p) + '<b>Hallo ' + esc(p.name) + '!</b><button type="button" class="me-link" data-me-tog aria-expanded="true">▴ Zuklappen</button>' +
    (p.card ? '<a class="me-link" href="#karten" data-card="' + esc(p.id) + '">Meine Karte</a>' : '') + '<button type="button" class="me-link" data-me-open>Ändern</button></div>' +
    (chips.length ? '<div class="me-chips">' + chips.map(x => '<span>' + x + '</span>').join('') + '</div>' : '') + '</div>';
}
document.addEventListener('click', e => {
  const tg = e.target.closest('[data-me-tog]'); if (tg && tg.closest('#me-box')) { store.set('meOpen', store.get('meOpen') === '1' ? '0' : '1'); renderMe(); return; }
  const b = e.target.closest('[data-me],[data-me-skip],[data-me-open]'); if (!b || !b.closest('#me-box')) return;
  if (b.dataset.me) {
    ME = b.dataset.me; store.set('me', ME);
    const g = Object.keys(GROUP_IDS).find(k => GROUP_IDS[k].includes(ME)); if (g && typeof setGroup === 'function') setGroup(g);
  } else if ('meSkip' in b.dataset) store.set('meSkip', '1');
  else { ME = null; store.set('me', ''); store.set('meSkip', '0'); }
  meMark(); renderMe();
});

/* Zahlen per Knopf statt Handy-Tastatur (Zahlenfelder ließen die Seite im claude.ai-Viewer hängen).
   Ein verstecktes <input> trägt den Wert, damit bestehender Code (.value, input/change) weiter funktioniert. */
function stepper(attrs, v, opt) {
  const o = Object.assign({min: 0, max: 9999, dec: 0, steps: [1, 10], unit: '', dis: false}, opt || {});
  const d = o.dis ? ' disabled' : '', st = o.steps.slice().sort((a, b) => b - a);
  const b = x => '<button type="button" data-d="' + x + '"' + d + ' aria-label="' + (x > 0 ? 'plus ' : 'minus ') + Math.abs(x) + '">' + (x > 0 ? '+' : '−') + (Math.abs(x) === o.steps[0] ? '' : String(Math.abs(x)).replace('.', ',')) + '</button>';
  return '<span class="stp" data-min="' + o.min + '" data-max="' + o.max + '" data-dec="' + o.dec + '">' + st.map(x => b(-x)).join('') +
    '<output>' + stpFmt(v, o.dec) + '</output>' + st.slice().reverse().map(b).join('') + '<input type="hidden" ' + attrs + ' value="' + (v ?? '') + '">' + (o.unit ? '<span class="u">' + esc(o.unit) + '</span>' : '') + '</span>';
}
function stpFmt(v, dec) { return v === '' || v === undefined || v === null || isNaN(+v) ? '–' : (+v).toLocaleString('de-DE', {minimumFractionDigits: +dec, maximumFractionDigits: +dec}); }
function stpSync(input) { const sp = input.closest('.stp'); if (sp) sp.querySelector('output').textContent = stpFmt(input.value, sp.dataset.dec); }
document.addEventListener('click', e => {
  const b = e.target.closest('.stp button[data-d]'); if (!b || b.disabled) return;
  const sp = b.parentElement, inp = sp.querySelector('input'), dec = +sp.dataset.dec;
  const cur = inp.value === '' ? (+b.dataset.d > 0 ? 0 : +sp.dataset.min) : +inp.value;
  const v = Math.min(+sp.dataset.max, Math.max(+sp.dataset.min, Math.round((cur + +b.dataset.d) * 10 ** dec) / 10 ** dec));
  inp.value = v; stpSync(inp);
  inp.dispatchEvent(new Event('input', {bubbles: true})); inp.dispatchEvent(new Event('change', {bubbles: true}));
});
/* ---------- Offline-Warteschlange + Live-Anzeige ----------
   Alle Schreibzugriffe laufen über getDb(). Ohne Netz (oder wenn das Speichern hängt) landet der Eintrag in einer
   Warteschlange im localStorage und wird automatisch nachgeschickt, sobald wieder Netz da ist. Die Dokument-ID wird
   vorher vergeben, deshalb ist Nachschicken doppelt-sicher (set auf denselben Pfad). */
let DBP = null, rawDb = null, flushing = false;
const qLoad = () => { try { return JSON.parse(store.get('outbox') || '[]'); } catch (e) { return []; } };
const qSave = q => { store.set('outbox', JSON.stringify(q)); netPaint(); };
const NETERR = /unavailable|network|offline|timeout|deadline|fetch|failed to fetch|disconnected/i;
function withTimeout(p, ms) { return Promise.race([p, new Promise((_, rej) => setTimeout(() => rej({code: 'timeout'}), ms))]); }
async function guarded(op, path, data, run) {
  const q = qLoad();
  if (q.length || navigator.onLine === false) { q.push({op, path, data}); qSave(q); return; }
  try { await withTimeout(run(), 10000); }
  catch (err) {
    const c = String((err && (err.code || err.name || err.message)) || '');
    if (!NETERR.test(c) && navigator.onLine !== false) throw err;
    const q2 = qLoad(); q2.push({op, path, data}); qSave(q2); scheduleFlush();
  }
}
// schlanke Hüllen statt Prototyp-Tricks (Plattform-Objekte sind eingefroren)
function wrapRef(r) {
  return {id: r.id, path: r.path,
    set: d => guarded('set', r.path, d, () => r.set(d)),
    delete: () => guarded('del', r.path, null, () => r.delete()),
    get: (...a) => r.get(...a), onSnapshot: (...a) => r.onSnapshot(...a)};
}
// Letzter Stand jeder Collection im localStorage: Seite zeigt sofort (und bei schlechtem Netz) die zuletzt gesehenen Daten
const CACHE_PRE = 'br26.cache.';
function cachedSnap(name) {
  try { const c = JSON.parse(localStorage.getItem(CACHE_PRE + name) || 'null'); if (!c || !Array.isArray(c.d)) return null;
    return {docs: c.d.map(x => ({id: x.id, exists: true, data: () => JSON.parse(JSON.stringify(x.v))})), cached: c.ts}; } catch (e) { return null; }
}
function wrapCol(c, name) {
  return {doc: id => wrapRef(id === undefined ? c.doc() : c.doc(id)), get: (...a) => c.get(...a),
    onSnapshot: (cb, err) => {
      let live = false; const old = name && cachedSnap(name);
      if (old) setTimeout(() => { if (!live) cb(old); }, 0);
      return c.onSnapshot(snap => { live = true;
        if (name) try { localStorage.setItem(CACHE_PRE + name, JSON.stringify({ts: Date.now(), d: snap.docs.filter(d => d.exists).map(d => ({id: d.id, v: d.data()}))})); } catch (e) {}
        cb(snap); }, err);
    }};
}
function getDb() {
  if (!DBP) DBP = (async () => {
    if (!window.claude || !window.claude.use) return null;
    rawDb = await window.claude.use('db'); if (!rawDb) return null;
    setTimeout(flush, 500); netPaint();
    return {collection: name => wrapCol(rawDb.collection(name), name), doc: path => wrapRef(rawDb.doc(path))};
  })();
  return DBP;
}
async function flush() {
  if (flushing || !rawDb || navigator.onLine === false) return;
  flushing = true;
  try {
    let q = qLoad();
    while (q.length) {
      const x = q[0];
      try { await withTimeout(x.op === 'del' ? rawDb.doc(x.path).delete() : rawDb.doc(x.path).set(x.data), 10000); }
      catch (err) { const c = String((err && (err.code || err.message)) || ''); if (NETERR.test(c)) break; }   // andere Fehler: Eintrag verwerfen
      q = qLoad(); q.shift(); qSave(q);
    }
  } finally { flushing = false; netPaint(); }
}
let flushT = null;
function scheduleFlush() { clearTimeout(flushT); flushT = setTimeout(async () => { await flush(); if (qLoad().length) scheduleFlush(); }, 20000); }
window.addEventListener('online', () => { netPaint(); flush(); });
window.addEventListener('offline', netPaint);
let netWriter = false;
function netPaint() {
  if (PRINT) return;
  let el = document.getElementById('net');
  if (!el) { el = document.createElement('div'); el.id = 'net'; el.className = 'net'; el.setAttribute('role', 'status'); document.body.appendChild(el); }
  const n = qLoad().length, off = navigator.onLine === false;
  if (!rawDb && !n) { el.hidden = true; return; }
  el.className = 'net ' + (n ? 'wait' : off ? 'off' : 'live');
  el.textContent = n ? '⏳ ' + n + (n === 1 ? ' Eintrag wartet' : ' Einträge warten') + (off ? ' · offline' : ' · sende …') : off ? '○ offline' : '● live';
  el.hidden = !(netWriter || n || off);       // „live“ nur für den Admin, offline/wartend für alle
}

/* Kurze Leiste nach dem Speichern: „Gespeichert · Rückgängig“ */
let undoTimer = null;
function undoToast(text, undo) {
  let el = document.getElementById('undo-bar');
  if (!el) { el = document.createElement('div'); el.id = 'undo-bar'; el.className = 'undo-bar'; el.setAttribute('role', 'status'); document.body.appendChild(el); }
  el.innerHTML = '<span>' + esc(text) + '</span>' + (undo ? '<button type="button">Rückgängig</button>' : '');
  el.hidden = false; clearTimeout(undoTimer);
  if (undo) el.querySelector('button').onclick = async () => {
    el.querySelector('button').disabled = true;
    try { await undo(); el.innerHTML = '<span>↩︎ Rückgängig gemacht</span>'; } catch (err) { el.innerHTML = '<span>Konnte nicht rückgängig machen.</span>'; }
    clearTimeout(undoTimer); undoTimer = setTimeout(() => { el.hidden = true; }, 2500);
  };
  undoTimer = setTimeout(() => { el.hidden = true; }, 9000);
}

/* Gast-Ansicht: der Admin sieht die Seite wie alle anderen (nur auf diesem Gerät, ändert keine Rechte) */
const GUEST = store.get('guest') === '1';
let canWriteP = null;
function canWrite() {
  if (!canWriteP) canWriteP = (async () => {
    const user = await window.claude.use('user');
    const w = user ? await user.can('data.write') : null;
    if (w !== false && !PRINT) showGuestSwitch();
    if (w !== false && !GUEST && !PRINT) showFab();
    if (w !== false && !GUEST) { netWriter = true; netPaint(); }
    return GUEST ? false : w;
  })();
  return canWriteP;
}
/* „➕ Schnell eintragen“: nur für den Admin, von überall erreichbar */
function showFab() {
  if (document.getElementById('fab')) return;
  const go = (id, open) => { const el = document.getElementById(open || id); if (el && el.tagName === 'DETAILS') el.open = true;
    const d = document.querySelector('#fc-edit details'); if (open === 'fc-edit' && d) d.open = true; jump(id, true); };
  const items = [['🍻', 'Drink', () => go('dr-add')], ['🏆', 'Spiel', () => go('spiele')], ['📍', 'Check-in', () => go('checkin')], ['⚽', 'Kartenwert', () => go('fc-edit', 'fc-edit')]];
  const wrap = document.createElement('div'); wrap.className = 'fab-wrap';
  wrap.innerHTML = '<div class="fab-menu" id="fab-menu" hidden><div class="fab-again" id="fab-again"></div>' + items.map((x, i) => '<button type="button" data-i="' + i + '"><span>' + x[0] + '</span>' + x[1] + '</button>').join('') + '</div>' +
    '<button type="button" class="fab" id="fab" aria-expanded="false" aria-label="Schnell eintragen">＋</button>';
  document.body.appendChild(wrap);
  const menu = wrap.querySelector('#fab-menu'), fab = wrap.querySelector('#fab');
  const toggle = on => { menu.hidden = !on; fab.setAttribute('aria-expanded', String(on)); fab.textContent = on ? '✕' : '＋';
    if (on) { const ub = document.getElementById('undo-bar'); if (ub) ub.hidden = true; const rec = [...document.querySelectorAll('#dr-again button[data-r]')];
      wrap.querySelector('#fab-again').innerHTML = rec.length ? '<span class="eyebrow">⚡ Nochmal</span>' + rec.map((b, i) => '<button type="button" data-a="' + i + '">' + esc(b.textContent) + '</button>').join('') : ''; } };
  fab.addEventListener('click', () => toggle(menu.hidden));
  menu.addEventListener('click', e => {
    const a = e.target.closest('[data-a]'); if (a) { const src = document.querySelectorAll('#dr-again button[data-r]')[+a.dataset.a]; if (src) src.click(); toggle(false); return; }
    const b = e.target.closest('[data-i]'); if (b) { toggle(false); items[+b.dataset.i][2](); }
  });
  document.addEventListener('click', e => { if (!menu.hidden && !wrap.contains(e.target)) toggle(false); });
}
function setGuest(on) { store.set('guest', on ? '1' : '0'); location.reload(); }
function showGuestSwitch() {
  const box = document.getElementById('guest-box'); if (box) box.hidden = false;
  const b = document.getElementById('guest-btn');
  if (b) { b.textContent = GUEST ? '🔑 Zurück zur Admin-Ansicht' : '👁 Als Gast ansehen'; b.onclick = () => setGuest(!GUEST); }
  if (GUEST && !document.getElementById('guest-bar')) {
    const bar = document.createElement('div'); bar.id = 'guest-bar'; bar.className = 'guest-bar';
    bar.innerHTML = '👁 Gast-Ansicht <button type="button">Beenden</button>';
    bar.querySelector('button').onclick = () => setGuest(false);
    document.body.appendChild(bar);
  }
}
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;'}[c]));

function isoToday() {
  return new Intl.DateTimeFormat('en-CA', {timeZone: TZ, year: 'numeric', month: '2-digit', day: '2-digit'}).format(new Date());
}
function dateObj(iso) { return new Date(iso + 'T12:00:00Z'); }
function fmtDay(iso) {
  const d = dateObj(iso);
  const wd = new Intl.DateTimeFormat('de-DE', {weekday: 'short', timeZone: 'UTC'}).format(d).replace('.', '');
  return {wd, dm: String(d.getUTCDate()).padStart(2, '0') + '.' + String(d.getUTCMonth() + 1).padStart(2, '0') + '.'};
}
function daysBetween(a, b) { return Math.round((dateObj(b) - dateObj(a)) / 864e5); }
const forGroup = (g) => TRIP.days.filter(d => g === 'all' || d.g === 'all' || d.g === g);
const gName = g => g === 'a' ? 'Gringos plus 1 Cevapi' : 'Daijo & Greisel';

let G = PRINT ? 'all' : (store.get('group') === 'b' ? 'b' : 'a');

/* ---------- Heute ---------- */
function itemsHtml(items) {
  return '<ul>' + items.map(it =>
    (it.time ? '<li><span class="t">' + esc(it.time) + '</span><span>' : '<li class="nt"><span>') + esc(it.text) +
    (it.unsicher ? ' <span class="unsure">(offen)</span>' : '') + '</span></li>').join('') + '</ul>';
}
/* Bild zur Station (Kopie aus den Stationen, IDs eindeutig gemacht) */
const SCENE_OF = {'Guarujá': 'guaruja', 'Rio de Janeiro': 'rio', 'Foz do Iguaçu': 'iguacu', 'Manaus': 'manaus', 'Juma Lodge': 'juma', 'Paraty': 'paraty', 'Ilha Grande': 'ilha'};
let sceneN = 0;
function sceneHtml(place) {
  const src = document.querySelector('.stop-img[data-scene="' + SCENE_OF[place] + '"]');
  if (!src) return '';
  const n = 't' + (++sceneN);
  let h = src.innerHTML;
  (h.match(/id="([^"]+)"/g) || []).forEach(m => { const id = m.slice(4, -1); h = h.split('id="' + id + '"').join('id="' + id + n + '"').split('url(#' + id + ')').join('url(#' + id + n + ')'); });
  return '<div class="today-img" aria-hidden="true">' + h + '</div>';
}
function setSkyTime() {
  const hr = +new Intl.DateTimeFormat('en-GB', {timeZone: TZ, hour: '2-digit', hour12: false}).format(new Date()) % 24;
  const t = hr >= 5 && hr < 8 ? 'morning' : hr >= 8 && hr < 17 ? 'day' : hr >= 17 && hr < 20 ? 'sunset' : 'night';
  const h = document.querySelector('header'); if (h) h.dataset.time = t;
}
setSkyTime(); setInterval(setSkyTime, 10 * 60000);
/* Kopfbild: vor der Reise Copacabana, unterwegs das Foto der heutigen Station */
function setHero(place) {
  const img = document.querySelector('header .hero-photo'); if (!img) return;
  if (!img.dataset.home) img.dataset.home = img.getAttribute('src');
  const ph = place && document.querySelector('.stop-img[data-scene="' + SCENE_OF[place] + '"] .scene-photo');
  const src = ph ? ph.getAttribute('src') : img.dataset.home;
  if (img.getAttribute('src') !== src) img.setAttribute('src', src);
}
function renderToday() {
  const el = document.getElementById('today');
  const t = isoToday();
  const list = forGroup(G);
  const first = list[0].date, last = list[list.length - 1].date;
  let html;
  if (t < first) {
    const n = daysBetween(t, first);
    const d0 = list[0];
    setHero(null);
    html = '<div class="kicker">' + esc(gName(G)) + ' · Countdown</div>' +
      '<div class="big">Noch ' + n + (n === 1 ? ' Tag' : ' Tage') + '<small>bis zum Abflug am ' + fmtDay(first).wd + ' ' + fmtDay(first).dm + ' · erster Stopp: ' + esc(list.find(d => !['München', 'Abflug'].includes(d.place))?.place || d0.place) + '</small></div>' +
      itemsHtml(d0.items) +
      '<div class="next">🎁 <a href="#kalender">Heutiges Türchen öffnen</a> · ⏳ <a href="#kapsel">Zeitkapsel</a>' +
      (n <= 7 ? '<br>📥 Vor dem Abflug: <a href="#downloads">PDF und Kalender aufs Handy laden</a>, die Seite selbst braucht Internet.' : '') + '</div>';
  } else if (t > last) {
    html = '<div class="kicker">' + esc(gName(G)) + '</div><div class="big">Tchau, Brasil<small>Die Reise ist vorbei. Obrigado und willkommen zurück!</small></div>';
  } else {
    const today = list.filter(d => d.date === t);
    const tomorrow = list.filter(d => d.date > t).filter((d, i, a) => d.date === a[0].date);
    const f = fmtDay(t);
    setHero(today.length ? today[0].place : null);
    html = '<div class="kicker">' + f.wd + ' ' + f.dm + ' · Tag ' + (daysBetween(first, t) + 1) + ' von ' + (daysBetween(first, last) + 1) + ' · ' + esc(gName(G)) + '</div>';
    if (today.length) {
      const d = today[0];
      html += '<div class="big">' + esc(d.place) + '<small>' + esc(d.title) + '</small></div>' +
        itemsHtml(today.flatMap(x => x.items)) +
        '<div class="stay">Schlafen: <b>' + esc(d.stay) + '</b>' + (drvForStay(d.stay) ? ' ' + drvBtn(drvForStay(d.stay)) : '') + '</div>';
    }
    if (tomorrow.length) {
      const n = tomorrow[0], nf = fmtDay(n.date);
      html += '<div class="next">Morgen, ' + nf.wd + ' ' + nf.dm + ': <b>' + esc(n.title) + '</b> · ' + esc(n.place) +
        (n.items.find(i => i.time) ? ' · ab ' + esc(n.items.find(i => i.time).time) : '') + '</div>';
    }
  }
  el.innerHTML = html;
  const hf = document.getElementById('hf-open');
  if (hf) hf.textContent = (TRIP.flights || []).filter(f => f.status === 'open').length;
  const hn = document.getElementById('hf-n');
  if (hn) hn.innerHTML = G === 'b' ? '<b>16+</b> Nächte (2 im Flieger, Rio-Verlängerung offen)' : '<b>25</b> Nächte (3 davon im Flieger)';
}

/* ---------- Tag fuer Tag ---------- */
/* ---------- Karussell (Tage nach Stationen, Flüge): eine Karte pro Ansicht zum Wischen, Chips/Pfeile, Höhe = aktuelle Karte ---------- */
function slider(track, chips, opt) {
  opt = opt || {}; track.classList.add('car'); const kids = () => [...track.children];
  let nav = track.__nav; if (!nav) { nav = document.createElement('div'); nav.className = 'car-nav' + (opt.top ? ' top' : ''); opt.top ? track.before(nav) : track.after(nav); track.__nav = nav; }
  nav.innerHTML = '<button type="button" class="car-prev" aria-label="Zurück">‹</button><div class="car-chips">' + chips.map((c, i) => '<button type="button" data-i="' + i + '">' + c + '</button>').join('') + '</div><button type="button" class="car-next" aria-label="Weiter">›</button>';
  const cur = () => { const x = track.scrollLeft; let best = 0, d = 1e9; kids().forEach((k, i) => { const dd = Math.abs(k.offsetLeft - track.offsetLeft - x); if (dd < d) { d = dd; best = i; } }); return best; };
  const fit = () => { const c = kids()[cur()]; if (c && c.offsetHeight) track.style.height = c.offsetHeight + 'px'; };
  const mark = () => { const i = cur(); nav.querySelectorAll('.car-chips button').forEach((b, k) => { b.setAttribute('aria-current', k === i ? 'true' : 'false'); if (k === i && b.scrollIntoView && nav.__seen) b.parentElement.scrollTo({left: b.offsetLeft - b.parentElement.clientWidth / 2 + b.offsetWidth / 2, behavior: 'smooth'}); });
    nav.__seen = true; fit(); };
  const go = (i, instant) => { const k = kids(); i = Math.max(0, Math.min(k.length - 1, i)); track.scrollTo({left: k[i].offsetLeft - track.offsetLeft, behavior: instant || (window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches) ? 'auto' : 'smooth'}); setTimeout(mark, instant ? 0 : 350); };
  nav.querySelector('.car-prev').onclick = () => go(cur() - 1); nav.querySelector('.car-next').onclick = () => go(cur() + 1);
  nav.querySelectorAll('.car-chips button').forEach(b => b.onclick = () => go(+b.dataset.i));
  if (!track.__bound) { track.__bound = 1; track.addEventListener('scroll', () => { clearTimeout(track.__t); track.__t = setTimeout(mark, 90); }, {passive: true});
    track.addEventListener('toggle', fit, true); if ('ResizeObserver' in window) new ResizeObserver(fit).observe(track); }
  track.__go = go; track.__idx = el => kids().findIndex(k => k.contains(el));
  requestAnimationFrame(() => { go(opt.start || 0, true); mark(); });
  return {go, cur};
}

  document.querySelectorAll('#stationen .stop').forEach(el => {

// Tage den Stationen der Karte zuordnen (Anreise zählt zur ersten Station der Gruppe)
function stopOfDay(d) {

  if (d.g === 'b' && d.date < '2027-01-06') return 'iguacu';

function renderDays() {
  const t = isoToday(), box = document.getElementById('days');

      d.items.map(it => '<li>' + (it.time ? '<span class="tm">' + esc(it.time) + '</span> ' : '') + esc(it.text) +
        (it.unsicher ? ' <span class="unsure">(offen)</span>' : '') + '</li>').join('') + '</ul></div></div>'; };
  const days = forGroup(G);
  if (PRINT) { box.innerHTML = days.map(row).join(''); return; }
  // nach Stationen der Karte: Chips oben, je Station eine Karte mit den Tageszeilen (unverändert)
  const stops = TRIP.mapinfo.stops.filter(s => days.some(d => stopOfDay(d) === s.id));

  const SN = stationNodes();
  box.innerHTML = stops.map(s => { const ds = days.filter(d => stopOfDay(d) === s.id);
    return '<div class="st-panel" data-stop="' + s.id + '"><div class="st-head"><span class="st-n">' + s.n + '</span><div><b>' + esc(s.name) + '</b><small>' + esc(s.dates) + ' · ' + s.nights + (s.nights === 1 ? ' Nacht' : ' Nächte') + ' · ' + ds.length + ' Tage</small></div>' + (SN['pill:' + s.id] || '') + '</div>' +
      '<div class="days2">' + ds.map(row).join('') + '</div></div>'; }).join('');
  box.querySelectorAll('.st-panel').forEach(p => { const n = SN[p.dataset.stop]; if (n) p.querySelector('.st-head').after(n);
    if (p.dataset.stop === 'ilha' && SN.heim) p.appendChild(SN.heim); });
  let start = stops.findIndex(s => days.some(d => stopOfDay(d) === s.id && d.date >= t)); if (start < 0) start = 0;

}

/* ---------- Kosten ---------- */
function renderCosts() {
  // Kosten nach Art getrennt: Flüge und Unterkünfte je mit Zwischensumme, Balken zeigt den Anteil (hell = geschätzt)
  const eur = v => v.toLocaleString('de-DE', Number.isInteger(v) ? {} : {minimumFractionDigits: 2, maximumFractionDigits: 2}) + ' €';
  const CAT = [['flug', '✈️', 'Flüge'], ['stay', '🛏️', 'Unterkünfte']];
  const sum = rows => rows.filter(r => r.k === 'fix' || r.k === 'ca').reduce((s, r) => s + r.v, 0);
  const val = r => r.k === 'open' ? 'offen' : r.k === 'split' ? 'noch offen' : (r.k === 'ca' ? 'ca. ' : '') + eur(r.v);
  const tag = r => ({fix: '<i class="st ok">✓ fest</i>', ca: '<i class="st ca">≈ Richtwert</i>', open: '<i class="st op">⏳ offen</i>', split: '<i class="st sp">÷ Splitwise</i>'})[r.k] || '';
  const box = g => {
    const rows = TRIP.costs.filter(c => c[g]).map(c => ({label: c.label, cat: c.cat, url: c.url, sub: c[g].sub || c.sub, ...c[g]}));
    const tot = sum(rows), open = rows.filter(r => r.k === 'open' || r.k === 'split').length;
    const bar = CAT.map(([k]) => { const rs = rows.filter(r => r.cat === k);
      return ['fix', 'ca'].map(kk => { const v = sum(rs.filter(r => r.k === kk)); return v ? '<i class="c-' + k + (kk === 'ca' ? ' est' : '') + '" style="width:' + (v / tot * 100) + '%"></i>' : ''; }).join(''); }).join('');
    return '<div class="co"><div class="co-sum"><span class="grp">' + esc(gName(g)) + ' · pro Person, bekannte Posten</span><b>ca. ' + eur(Math.round(tot / 10) * 10) + '</b></div>' +
      '<div class="co-bar" role="img" aria-label="Aufteilung Flüge und Unterkünfte">' + bar + '</div>' +
      '<div class="co-leg">' + CAT.map(([k, e, n]) => '<span><i class="c-' + k + '"></i>' + e + ' ' + n + ' ' + eur(sum(rows.filter(r => r.cat === k))) + '</span>').join('') +
      '<span><i class="est-key"></i>hell = Richtwert</span>' + (open ? '<span>+ ' + open + ' Posten offen</span>' : '') + '</div>' +
      CAT.map(([k, e, n]) => { const rs = rows.filter(r => r.cat === k); if (!rs.length) return '';
        return '<div class="co-grp c-' + k + '"><div class="co-gh"><span>' + e + ' ' + n + '</span><b>' + eur(sum(rs)) + (rs.some(r => r.k === 'open' || r.k === 'split') ? ' <small>+ offen</small>' : '') + '</b></div><ul class="co-list">' +
          rs.map(r => '<li><span class="co-l"><b>' + (r.url ? '<a class="co-a" href="' + esc(r.url) + '" target="_blank" rel="noopener">' + esc(r.label) + ' <span aria-hidden="true">↗</span></a>' : esc(r.label)) + '</b>' + (r.sub ? '<small>' + esc(r.sub) + '</small>' : '') + '</span><span class="co-r"><span class="v c-' + r.k + '">' + val(r) + '</span>' + tag(r) + '</span></li>').join('') + '</ul></div>'; }).join('') +
      '</div>';
  };
  document.getElementById('co-box').innerHTML = G === 'all' ? box('a') + box('b') : box(G);
}

  let dates;
  if (ev.start) dates = ev.start + '/' + ev.end;
  else {
    const d = dateObj(fallbackDate); d.setUTCDate(d.getUTCDate() + 1);
    dates = ev.date + '/' + d.toISOString().slice(0, 10).replace(/-/g, '');
  }
  return 'https://calendar.google.com/calendar/render?action=TEMPLATE&text=' + encodeURIComponent(ev.summary) +
    '&dates=' + dates + '&details=' + encodeURIComponent((ev.desc || '') + '\nBrasilien 26/27');
}

(async () => {
  const btn = document.getElementById('pdf-btn');
  const dl = window.claude && window.claude.use ? await window.claude.use('downloads').catch(() => null) : null;
  async function save(b) {
    try {
      const res = await fetch('brasilien-reise.pdf');
      if (!res.ok) throw new Error('fetch');
      await dl.save({filename: 'Brasilien-26-27.pdf', data: await res.blob()});
      try { localStorage.setItem('br26.pdfSaved', isoToday()); } catch (e) {}
      return true;
    } catch (e) {
      if (!(e && e.code === 'declined')) b.insertAdjacentHTML('afterend', ' <span class="note">Ging nicht, bitte den <a href="https://github.com/schuchpatrick-hub/Brasilien/blob/main/brasilien-reise.pdf" target="_blank" rel="noopener">GitHub-Link</a> nehmen.</span>');
      return false;
    }
  }
  if (!dl) btn.hidden = true; else btn.addEventListener('click', () => save(btn));
  // Hinweis im Kopf vor Strecken ohne (gutes) Netz, sonst nur wenn das Handy offline ist
  if (PRINT) return;
  const W = [['2026-12-20', '2026-12-27', '✈️ Vor dem Abflug: die Reise-Mappe (PDF mit Tagen, Flügen, Fahrer-Karten und Sprachführer) aufs Handy laden. Die Webseite braucht Netz.'],
    ['2027-01-08', '2027-01-10', '🌴 Ab 10.01. im Dschungel gibt es kaum Netz: jetzt die Reise-Mappe (PDF) aufs Handy laden.'],
    ['2027-01-14', '2027-01-16', '⛵ Auf Ilha Grande ist das Netz wackelig: Reise-Mappe (PDF) aufs Handy laden.']];
  const box = document.getElementById('heute'); if (!box) return;
  function show() {
    const t = isoToday(), w = W.find(x => t >= x[0] && t <= x[1]), off = navigator.onLine === false;
    let hide = ''; try { hide = localStorage.getItem('br26.offHide') || ''; } catch (e) {}
    let el = document.getElementById('off-hint');
    if ((!w && !off) || (!off && hide === t)) { if (el) el.remove(); return; }
    if (!el) { el = document.createElement('div'); el.id = 'off-hint'; el.className = 'off-hint'; box.appendChild(el); }
    el.innerHTML = '<span>' + (off ? '📴 Gerade offline: Du siehst den zuletzt geladenen Stand. Einträge werden nachgeschickt, sobald wieder Netz da ist.' : esc(w[2])) + '</span>' +
      (!off && dl ? '<button type="button" class="btn" data-off-pdf>📄 PDF speichern</button>' : '') + (!off ? '<button type="button" class="off-x" data-off-x aria-label="Heute ausblenden">×</button>' : '');
  }
  box.addEventListener('click', async e => {
    if (e.target.closest('[data-off-x]')) { try { localStorage.setItem('br26.offHide', isoToday()); } catch (err) {} show(); }
    const b = e.target.closest('[data-off-pdf]'); if (b && await save(b)) { b.textContent = '✓ Gespeichert'; b.disabled = true; }
  });
  addEventListener('online', show); addEventListener('offline', show); show();
})();

/* ---------- Sprachfuehrer mit Sprachausgabe ---------- */

    const ico = c => (ICON.find(x => c.cat.includes(x[0])) || ['', '💬'])[1], short = c => c.cat.replace(/\s*\(.*\)/, '').replace(' & Smalltalk', '').replace('Überlebenssätze', 'Überleben');

      '<div class="ph-cats" role="tablist" aria-label="Themen">' + TRIP.phrases.map((c, ci) => '<button type="button" role="tab" data-ci="' + ci + '"' + (/Notfall/.test(c.cat) ? ' class="sos"' : '') + '>' + ico(c) + ' ' + esc(short(c)) + '</button>').join('') +
      '<button type="button" role="tab" data-ci="learn" class="learn">🎴 Üben</button></div>' +
      TRIP.phrases.map((c, ci) => '<div class="pcat' + (c.items.length > 7 ? ' short' : '') + '" data-ci="' + ci + '" hidden>' + c.items.map((p, pi) => row(p, ci, pi)).join('') +
        (c.items.length > 7 ? '<button type="button" class="ph-more">＋ ' + (c.items.length - 6) + ' weitere Sätze</button>' : '') + '</div>').join('') +

    box.addEventListener('click', e => { const m = e.target.closest('.ph-more'); if (m) { m.closest('.pcat').classList.remove('short'); m.remove(); } });
    const catOf = re => TRIP.phrases.findIndex(c => re.test(c.cat));
    function show(ci, save) {

      box.querySelectorAll('.pcat[data-ci]').forEach(p => { p.hidden = p.dataset.ci !== String(ci); });
      learnBox.hidden = ci !== 'learn'; if (ci === 'learn') learn();
      if (save) { store.set('phCat', String(ci)); store.set('phCatDay', today); }
    }
    tabs.forEach(b => b.addEventListener('click', () => show(b.dataset.ci === 'learn' ? 'learn' : +b.dataset.ci, true)));
    // Start: heute selbst gewählt → das; unterwegs nach Uhrzeit in Rio (abends Party, mittags/abends Restaurant); sonst zuletzt gewähltes
    let start = store.get('phCat'); const manual = store.get('phCatDay') === today;
    if (!manual && today >= '2026-12-27' && today <= '2027-01-21') { let h = 12; try { h = +new Intl.DateTimeFormat('en-GB', {timeZone: 'America/Sao_Paulo', hour: 'numeric', hour12: false}).format(new Date()); } catch (e) {}

    // Karteikarten: Deutsch sehen, aufdecken (spielt ab), „Kann ich“ / „Nochmal“; gelernt pro Handy (localStorage br26.phLearned)

    let cur = null, shown = false;
    const key = x => x.ci + '-' + x.pi;
    function next() { const open = all.filter(x => !learned.includes(key(x))); cur = open.length ? open[Math.floor(Math.random() * open.length)] : null; shown = false; learn(); }
    function learn() {
      if (!cur || learned.includes(key(cur))) { const open = all.filter(x => !learned.includes(key(x))); cur = open.length ? open[Math.floor(Math.random() * open.length)] : null; shown = false; }

          : '<div class="pl-card"><div class="pl-de">🏆 Alle ' + all.length + ' Sätze gelernt! Du bist offiziell kein Gringo mehr. Fast.</div><div class="pl-btns"><button type="button" class="btn ghost" data-l="reset">Von vorn üben</button></div></div>');
    }
    learnBox.addEventListener('click', e => { const b = e.target.closest('[data-l]'); if (!b) return; const a = b.dataset.l;
      if (a === 'show') { shown = true; learn(); const pb = learnBox.querySelector('.play'); if (pb) pb.click(); }
      else if (a === 'ok') { learned.push(key(cur)); store.set('phLearned', JSON.stringify(learned)); next(); }
      else if (a === 'again') next();
      else if (a === 'reset') { learned = []; store.set('phLearned', '[]'); next(); } });
  }
  const st = document.getElementById('speak-status');
  const slow = document.getElementById('speak-slow');
  const dev = document.getElementById('speak-device');
  if (store.get('slow') === '0') slow.checked = false;
  slow.addEventListener('change', () => store.set('slow', slow.checked ? '1' : '0'));

  const synth = window.speechSynthesis && typeof SpeechSynthesisUtterance !== 'undefined' ? window.speechSynthesis : null;
  let voice = null;
  const pick = () => {
    const vs = synth.getVoices();
    // natürlich klingende Stimmen zuerst (Premium/Enhanced/Natural/Google), dann jede pt-BR-Stimme
    const br = vs.filter(v => /^pt[-_]BR/i.test(v.lang)), good = v => /premium|enhanced|natural|neural|google|luciana|francisca|thalita/i.test(v.name);
    voice = br.find(good) || br.find(v => v.localService) || br[0] || vs.find(v => /^pt/i.test(v.lang)) || null;
    document.getElementById('speak-device-wrap').hidden = !voice;
    if (voice && store.get('device') === null) dev.checked = true;   // Standard: Handy-Stimme, wenn vorhanden
  };
  if (synth) { pick(); if (synth.addEventListener) synth.addEventListener('voiceschanged', pick); }
  if (store.get('device') === '1') dev.checked = true;
  dev.addEventListener('change', () => store.set('device', dev.checked ? '1' : '0'));

  let audio = null, current = null;
  const done = () => { if (current) current.classList.remove('on'); current = null; };
  function speakDevice(p) {
    synth.cancel();
    const de = new SpeechSynthesisUtterance(p.de.replace(/\s*\([^)]*\)/g, '').replace(/…/g, ''));
    de.lang = 'de-DE'; de.rate = slow.checked ? 0.85 : 1;
    const vde = synth.getVoices().find(v => /^de[-_]/i.test(v.lang)); if (vde) de.voice = vde;
    const u = new SpeechSynthesisUtterance(p.pt.replace(/…/g, ''));
    u.lang = 'pt-BR'; if (voice) u.voice = voice;
    u.rate = slow.checked ? 0.75 : 1;
    u.onend = u.onerror = done;
    synth.speak(de); synth.speak(u);
  }
  box.addEventListener('click', e => {
    const b = e.target.closest('.play'); if (!b) return;
    const p = TRIP.phrases[+b.dataset.c].items[+b.dataset.p];
    if (audio) audio.pause();
    if (synth) synth.cancel();
    done(); current = b; b.classList.add('on'); st.textContent = '';
    if (dev.checked && synth && voice) { speakDevice(p); return; }
    audio = new Audio(p.audio);
    audio.playbackRate = slow.checked ? 0.8 : 1;
    audio.onended = done;
    audio.onerror = () => {
      done();
      if (synth) { current = b; b.classList.add('on'); speakDevice(p); }
      else st.textContent = 'Die Aufnahme konnte nicht geladen werden.';
    };
    audio.play().catch(err => { if (err && err.name !== 'AbortError') audio.onerror(); });
  });
})();

/* ---------- Drinks-Counter (geteilt ueber db, Collection "drinks") ---------- */
(function () {
  const D = TRIP.drinks, CREW = TRIP.crew;
  const CAT = Object.fromEntries(D.cats.map(c => [c[0], {name: c[1], icon: c[2]}]));
  const byId = Object.fromEntries(CREW.map(p => [p.id, p]));
  const $ = id => document.getElementById(id);
  const avatar = (p, cls) => '<span class="' + (cls || 'av') + '">' + (p.photo && !PRINT ? '<img src="' + esc(p.photo) + '" alt="" loading="lazy" decoding="async">' : esc(p.name[0])) + '</span>';
  const fmt1 = n => n.toLocaleString('de-DE', {minimumFractionDigits: 1, maximumFractionDigits: 1});
  const fmt2 = n => n.toLocaleString('de-DE', {minimumFractionDigits: 2, maximumFractionDigits: 2});
  const grams = d => d.ml * d.abv / 100 * 0.789;
  const dayOf = ts => new Intl.DateTimeFormat('en-CA', {timeZone: TZ, year: 'numeric', month: '2-digit', day: '2-digit'}).format(new Date(ts));
  const timeOf = ts => new Intl.DateTimeFormat('de-DE', {timeZone: TZ, hour: '2-digit', minute: '2-digit'}).format(new Date(ts));

  let drinks = [];            // [{id, who, cat, name, ml, abv, ts}]
  const body = {};            // id -> {sex, kg} (Overrides aus db)
  let dbRef = null, writable = false, metric = 'count';
  let sel = {who: new Set((store.get('drinkWho') || '').split(',').filter(id => byId[id])), preset: null};
  const saveWho = () => store.set('drinkWho', [...sel.who].join(','));

  /* --- Promille nach Widmark: Summe der Getraenke minus Abbau --- */
  const BETA = 0.15; // Promille pro Stunde
  function bodyOf(id) {
    const d = D.body[id] || ['m', 80], o = body[id] || {};
    const sex = o.sex || d[0], kg = +o.kg || d[1];
    return {sex, kg, r: sex === 'w' ? 0.55 : 0.68};
  }
  function bacTimeline(id) {                // liefert Funktion t -> Promille und Tages-Peaks
    const b = bodyOf(id), list = drinks.filter(d => d.who === id).sort((a, z) => a.ts - z.ts);
    let bac = 0, last = null; const peaks = {}; const pts = [];
    for (const d of list) {
      if (last !== null) bac = Math.max(0, bac - BETA * (d.ts - last) / 36e5);
      bac += grams(d) / (b.kg * b.r);
      last = d.ts; pts.push([d.ts, bac]);
      const day = dayOf(d.ts); peaks[day] = Math.max(peaks[day] || 0, bac);
    }
    const at = t => { if (last === null || t < list[0].ts) return 0; let v = 0; for (const [ts, x] of pts) { if (ts <= t) v = x - BETA * (t - ts) / 36e5; } return Math.max(0, v); };
    return {at, peaks, max: Math.max(0, ...Object.values(peaks))};
  }
  function level(v) {
    if (v < 0.1) return 'nüchtern, leider';
    if (v < 0.5) return 'angeheitert';
    if (v < 1.0) return 'beschwipst, Samba-Modus';
    if (v < 1.5) return 'blau wie das Meer vor Ilha Grande';
    if (v < 2.0) return 'Portugiesisch fließend';
    return 'Caipirinha-Koma, bitte Wasser';
  }

  /* --- Eingabe --- */
  $('dr-who').innerHTML = CREW.map(p => '<button type="button" role="checkbox" aria-checked="false" data-id="' + esc(p.id) + '">' + avatar(p) + esc(p.name) + '</button>').join('');
  $('dr-what').innerHTML = D.cats.map(c => {
    const items = D.presets.map((d, i) => [d, i]).filter(([d]) => d.cat === c[0]);
    if (!items.length) return '';

    else if (here) { a.href = 'https://www.google.com/maps/search/?api=1&query=' + encodeURIComponent(here + ', Brasil'); a.hidden = false; }
    else a.hidden = true;
  }
  function drawPins() {
    const g = svg.querySelector('#map-pins'); g.innerHTML = '';
    const list = checkins.slice(0, 40).slice().reverse();
    if (list.length > 1) g.appendChild(mk('polyline', {class: 'pin-trail', points: list.map(c => xy(c.lat, c.lon).map(v => v.toFixed(1)).join(',')).join(' ')}));
    list.forEach((c, i) => {
      const [x, y] = xy(c.lat, c.lon), last = i === list.length - 1;
      g.appendChild(mk('circle', {class: last ? 'pin' : 'pin-old', cx: x, cy: y, r: last ? 9 : 5}));
      if (last && c.label) {
        const W = svg.viewBox.baseVal.width, right = x > W - 160;
        const tx = mk('text', {class: 'pin-lbl', x: right ? x - 13 : x + 13, y: y + 24, 'text-anchor': right ? 'end' : 'start'});
        tx.textContent = c.label; g.appendChild(tx);

  }
  function renderList() {
    $('ci-list').innerHTML = checkins.slice(0, 30).map(c => '<li data-id="' + esc(c.id) + '"><span class="t">' + fmtDay(new Date(c.ts).toISOString().slice(0, 10)).dm + ' ' +
      new Intl.DateTimeFormat('de-DE', {timeZone: TZ, hour: '2-digit', minute: '2-digit'}).format(new Date(c.ts)) + '</span><span>' + esc(c.label || '–') +
      ' <a href="https://www.google.com/maps/search/?api=1&query=' + c.lat + ',' + c.lon + '" target="_blank" rel="noopener">' + c.lat.toFixed(4) + ', ' + c.lon.toFixed(4) + '</a></span>' +
      (canCheck ? '<button type="button" class="del" aria-label="Check-in löschen">×</button>' : '<span></span>') + '</li>').join('');
  }
  function parseCoords(s) {
    s = String(s || '').replace(/−/g, '-');
    const m = s.match(/@(-?\d+(?:\.\d+)?),\s*(-?\d+(?:\.\d+)?)/) || s.match(/(-?\d{1,2}(?:[.,]\d+)?)\s*[,; ]\s*(-?\d{1,3}(?:[.,]\d+)?)/);
    if (!m) return null;
    const lat = parseFloat(m[1].replace(',', '.')), lon = parseFloat(m[2].replace(',', '.'));
    if (!(Math.abs(lat) <= 90 && Math.abs(lon) <= 180)) return null;
    return {lat, lon};
  }
  function lock(on, msg) {
    canCheck = !on;
    $('checkin').classList.toggle('locked', on);
    $('ci-lock').hidden = !on;
    if (msg) $('ci-lock').innerHTML = msg;
    $('checkin').querySelectorAll('.ci-form input, .ci-form button').forEach(el => { el.disabled = on; });
    renderList();
  }
  $('ci-save').addEventListener('click', async () => {
    const c = parseCoords($('ci-coords').value);
    if (!c) { $('ci-status').textContent = 'Keine Koordinaten erkannt. Beispiel: -22.9711, -43.1822'; return; }
    if (c.lat > 10 || c.lat < -40 || c.lon < -80 || c.lon > -25) { $('ci-status').textContent = 'Die Koordinaten liegen nicht in Südamerika. Breite und Länge vertauscht?'; return; }
    try {
      await dbc.collection('checkins').doc().set({lat: c.lat, lon: c.lon, label: $('ci-label').value.trim().slice(0, 60), ts: Date.now()});
      $('ci-coords').value = ''; $('ci-label').value = '';
      $('ci-status').textContent = 'Eingecheckt ✅';
    } catch (e) {
      if (e && (e.code === 'invalid_argument' || e.code === 'not_granted')) lock(true); else $('ci-status').textContent = 'Hat nicht geklappt, bitte nochmal.';
    }
  });
  $('ci-list').addEventListener('click', async e => {
    const b = e.target.closest('.del'); if (!b || !dbc) return;
    try { await dbc.doc('checkins/' + b.closest('li').dataset.id).delete(); } catch (err) { $('ci-status').textContent = 'Konnte nicht löschen.'; }
  });

  lock(true); progress();
  if (PRINT) return;
  setInterval(progress, 10 * 60000);
  (async () => {
    if (!window.claude || !window.claude.use) return;
    dbc = await getDb(); if (!dbc) return;
    const w = await canWrite();
    lock(w === false);
    dbc.collection('checkins').onSnapshot(snap => {
      checkins = snap.docs.filter(d => d.exists).map(d => Object.assign({id: d.id}, d.data()))
        .filter(c => typeof c.lat === 'number' && typeof c.lon === 'number' && typeof c.ts === 'number').sort((a, b) => b.ts - a.ts);
      drawPins(); renderList(); progress();
    }, () => {});
  })();
})();

/* Real-Rechner mit lustigen Vergleichen */
(function () {
  const M = TRIP.money; if (!M || !document.getElementById('fx-amount')) return;
  const $ = id => document.getElementById(id);
  const amt = $('fx-amount'), rateIn = $('fx-rate');
  let dir = store.get('fx.dir') === 'eur' ? 'eur' : 'brl';
  let rate = parseFloat(store.get('fx.rate')) || M.rate;
  const num = (v, d) => v.toLocaleString('de-DE', {minimumFractionDigits: d, maximumFractionDigits: d});
  const money = (v, cur) => cur === '€' ? num(v, 2) + ' €' : 'R$ ' + num(v, 2);
  const count = n => n >= 100 ? num(Math.round(n), 0) : n >= 10 ? num(Math.round(n * 10) / 10, n % 1 ? 1 : 0)
    : n >= 0.1 ? num(Math.round(n * 10) / 10, 1).replace(/,0$/, '') : n.toLocaleString('de-DE', {maximumSignificantDigits: 2});
  let deck = [], last = null;
  function pick(brl) {
    const ok = M.compare.filter(c => c.always ? brl > 0 : brl / c.brl >= 0.5 && brl / c.brl <= 400);
    if (!ok.length) return '';
    deck = deck.filter(c => ok.includes(c));
    if (!deck.length) deck = ok.slice().sort(() => Math.random() - 0.5);
    let c = deck.shift();
    if (c === last && deck.length) { deck.push(c); c = deck.shift(); }
    last = c;
    return 'Das sind ' + c.t.replace('{n}', count(brl / c.brl));
  }
  function render(newJoke) {
    const v = Math.max(0, parseFloat(String(amt.value).replace(',', '.')) || 0);
    const brl = dir === 'brl' ? v : v * rate, eur = dir === 'brl' ? v / rate : v;
    $('fx-cur').textContent = dir === 'brl' ? 'R$' : '€';
    $('fx-res').textContent = dir === 'brl' ? money(v, 'R$') + ' = ' + money(eur, '€') : money(v, '€') + ' = ' + money(brl, 'R$');
    if (newJoke) {
      const j = $('fx-joke'); j.classList.add('fade');
      setTimeout(() => { j.textContent = brl > 0 ? pick(brl) : 'Nix eingetippt, nix getrunken. 🙃'; j.classList.remove('fade'); }, reduceMotionFx ? 0 : 180);
    }
    document.querySelectorAll('.fx-dir button').forEach(b => b.setAttribute('aria-pressed', b.dataset.dir === dir));
  }
  const reduceMotionFx = window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches;
  $('fx-quick').innerHTML = M.quick.map(q => '<button type="button" data-v="' + q + '">' + q + '</button>').join('');
  $('fx-quick').addEventListener('click', e => { const b = e.target.closest('button'); if (!b) return; amt.value = b.dataset.v; render(true); });
  document.querySelector('.fx-dir').addEventListener('click', e => {
    const b = e.target.closest('button'); if (!b || b.dataset.dir === dir) return;
    const v = parseFloat(amt.value) || 0;
    amt.value = String(Math.round((dir === 'brl' ? parseFloat(String(amt.value).replace(',', '.')) / rate || 0 : (parseFloat(String(amt.value).replace(',', '.')) || 0) * rate) * 100) / 100).replace('.', ',');
    dir = b.dataset.dir; store.set('fx.dir', dir); render(true);
  });
  // eigenes Tastenfeld statt Handy-Tastatur
  const pad = $('fx-pad');
  pad.innerHTML = ['1', '2', '3', '4', '5', '6', '7', '8', '9', ',', '0', '⌫'].map(k => '<button type="button" data-k="' + k + '">' + k + '</button>').join('') + '<button type="button" data-k="C" class="c">Löschen</button>';
  pad.addEventListener('click', e => {
    const b = e.target.closest('button[data-k]'); if (!b) return; let v = String(amt.value).replace('.', ','); const k = b.dataset.k;
    if (k === 'C') v = ''; else if (k === '⌫') v = v.slice(0, -1); else if (k === ',') { if (!v.includes(',')) v = (v || '0') + ','; }
    else if (v.replace(',', '').length < 7 && !(v.includes(',') && v.split(',')[1].length >= 2)) v = v === '0' ? k : v + k;
    amt.value = v; amt.dispatchEvent(new Event('input'));
  });
  let t; amt.addEventListener('input', () => { render(false); clearTimeout(t); t = setTimeout(() => render(true), 450); });
  $('fx-more').addEventListener('click', () => render(true));
  rateIn.value = rate; stpSync(rateIn);
  rateIn.addEventListener('input', () => { const r = parseFloat(String(rateIn.value).replace(',', '.')); if (r > 0) { rate = r; store.set('fx.rate', r); render(false); } });
  $('fx-note').textContent = 'Kurs: ' + M.rateNote + '. Eigenen Kurs mit Plus/Minus einstellen, er wird auf diesem Handy gespeichert. Vergleiche mit groben Richtpreisen, alle Angaben ohne Gewähr, Promille-Garantie keine.';
  if (dir === 'eur') amt.value = Math.round(50 / rate);
  render(true);
})();

/* ---------- Vorfreude-Kalender (ein Türchen pro Tag bis zum Abflug) ---------- */
(function () {
  const A = TRIP.advent; const feat = document.getElementById('adv-feature'); if (!A || !feat || PRINT) return;
  const CAT = {fact: 'Fun Fact', word: 'Portugiesisch', song: 'Song des Tages', crew: 'Crew-Wahrheit', food: 'Essen & Trinken', task: 'Aufgabe', place: 'Vorschau', special: 'Spezial'};

  let opened; try { opened = new Set(JSON.parse(store.get('adv.open') || '[]')); } catch (e) { opened = new Set(); }
  const save = () => store.set('adv.open', JSON.stringify([...opened]));
  let sel = null;
  const state = i => { const t = berlinToday(); return A[i].d > t ? 'fu' : opened.has(A[i].d) ? 'op' : 'av'; };
  const lastAvail = () => { const t = berlinToday(); let k = -1; A.forEach((x, i) => { if (x.d <= t) k = i; }); return k; };
  function confetti(el) {
    if (window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches) return;
    const c = document.createElement('div'); c.className = 'confetti';
    for (let i = 0; i < 40; i++) {
      const p = document.createElement('i');

      p.style.animationDelay = (Math.random() * .4) + 's'; p.style.transform = 'rotate(' + (Math.random() * 180) + 'deg)';
      c.appendChild(p);
    }
    el.appendChild(c); setTimeout(() => c.remove(), 2200);
  }
  function card(i) {
    const x = A[i], d = fmtDay(x.d);

      '<div class="emo" aria-hidden="true">' + x.e + '</div><h3>' + esc(x.t) + '</h3><p>' + esc(x.x) + '</p>' +
      (x.pt ? '<div class="adv-pt"><b>' + esc(x.pt) + '</b>' + (x.say ? '<span>Aussprache: ' + esc(x.say) + '</span>' : '') + '</div>' : '') + link +
      '<div class="adv-nav"><button type="button" data-go="' + (i - 1) + '"' + (prev ? '' : ' disabled') + '>← Türchen ' + i + '</button>' +
      '<button type="button" data-go="' + (i + 1) + '"' + (next ? '' : ' disabled') + '>Türchen ' + (i + 2) + ' →</button></div></div>';
  }
  function closed(i) {
    const x = A[i], fut = state(i) === 'fu', t = berlinToday();
    const n = daysBetween(t, x.d);
    return '<div class="adv-closed"><div class="adv-door" id="adv-door"><span class="bow" aria-hidden="true">🎀</span><div class="inside" aria-hidden="true">' + x.e + '</div>' +
      '<div class="leaf l"><span>' + (i + 1) + '</span><i class="knob"></i></div><div class="leaf r"><span>★</span><i class="knob"></i></div></div>' +
      (fut ? '<h3>Türchen ' + (i + 1) + '</h3><div class="lock">🔒 Öffnet ' + (n === 1 ? 'morgen' : 'in ' + n + ' Tagen') + ' (' + fmtDay(x.d).wd + ' ' + fmtDay(x.d).dm + ')</div>'
        : '<h3>' + (x.d === t ? 'Das heutige Türchen' : 'Türchen ' + (i + 1) + ' vom ' + fmtDay(x.d).dm) + '</h3><button type="button" class="btn" id="adv-open">Türchen öffnen 🎁</button>') + '</div>';
  }
  function show(i, animate) {
    sel = i;
    if (state(i) === 'op') feat.innerHTML = card(i);
    else feat.innerHTML = closed(i);

    if (b) b.addEventListener('click', () => {
      opened.add(A[i].d); save();

  }
  const reduced = window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches;

  function renderGrid() {
    const t = berlinToday();
    document.getElementById('adv-grid').innerHTML = A.map((x, i) => {
      const s = state(i), d = fmtDay(x.d);
      return '<button type="button" class="' + s + (x.d === t ? ' td' : '') + (i === sel ? ' sel' : '') + '" data-i="' + i + '" aria-label="Türchen ' + (i + 1) + ', ' + d.dm + (s === 'fu' ? ', noch verschlossen' : s === 'op' ? ', geöffnet: ' + esc(x.t) : ', bereit zum Öffnen') + '">' +

    }).join('');

      (dep > 0 ? '<span>Noch <b>' + dep + '</b> ' + (dep === 1 ? 'Tag' : 'Tage') + ' bis zum Abflug</span>' : dep === 0 ? '<span><b>Heute geht’s los!</b> ✈️</span>' : '<span>Alle Türchen sind offen, die Reise läuft 🇧🇷</span>') +
      (avail > op ? '<span>' + (avail - op) + ' Türchen warten noch auf dich</span>' : '');
  }

    const b = e.target.closest('button'); if (!b) return;

    show(i, true);

  const t = berlinToday();
  const ti = A.findIndex(x => x.d === t);
  show(ti >= 0 ? ti : (t < A[0].d ? 0 : Math.max(0, lastAvail())), false);
})();

// AudioBuffer (mono) → WAV als base64, für die Video-Aufnahmen
function wavB64(buf) {
  const sr = buf.sampleRate, d = buf.getChannelData(0), out = new DataView(new ArrayBuffer(44 + d.length * 2));
  const str = (o, s) => [...s].forEach((c, i) => out.setUint8(o + i, c.charCodeAt(0)));
  str(0, 'RIFF'); out.setUint32(4, 36 + d.length * 2, true); str(8, 'WAVEfmt '); out.setUint32(16, 16, true); out.setUint16(20, 1, true); out.setUint16(22, 1, true);
  out.setUint32(24, sr, true); out.setUint32(28, sr * 2, true); out.setUint16(32, 2, true); out.setUint16(34, 16, true); str(36, 'data'); out.setUint32(40, d.length * 2, true);
  for (let i = 0; i < d.length; i++) out.setInt16(44 + i * 2, Math.max(-1, Math.min(1, d[i])) * 32767, true);

  return btoa(b);
}

const TAB_IDS = [...document.querySelectorAll('.tabs a')].map(a => a.dataset.tab);

  function pause() { if (!S || !box.classList.contains('racing') || !res.hidden) return; S.paused = true; ptr.clear(); upd(); pm.hidden = false; if (AC) try { AC.suspend(); } catch (e) {} }
  const engOff = () => { if (eng && AC) { eng.g.gain.setTargetAtTime(0, AC.currentTime, .05); eng.sg.gain.setTargetAtTime(0, AC.currentTime, .05); } };
  function resume() { pm.hidden = true; if (S) S.paused = false; last = 0; audio(); }
  const setT = (sel, txt) => box.querySelectorAll(sel).forEach(b => { b.textContent = txt; });
  const sndTxt = () => setT('.kr-snd', SOUND ? '🔊 Ton: an' : '🔇 Ton: aus'), steerTxt = () => setT('.kr-steer', '🎚 Lenkstärke: ' + STEERS[STEER][0]), annTxt = () => setT('.kr-ann', '🎙 Ansager: ' + (ANN ? 'an' : 'aus'));
  const setTxt = () => { sndTxt(); steerTxt(); annTxt(); setT('.kr-ctl', '🎮 Steuerung: ' + (SET.ctl === 'analog' ? 'Analog (Daumen-Position)' : 'Halten links/rechts'));
    setT('.kr-q', '✨ Grafik: ' + ['Sparsam', 'Normal', 'Hoch'][SET.q]); setT('.kr-cam', '🎥 Kamera: ' + ['Nah', 'Normal', 'Weit'][SET.cam]); setT('.kr-tod', '🌗 Tageszeit: ' + (SET.tod === 'day' ? 'immer Tag' : 'wie in Rio')); };
  setTxt();
  box.addEventListener('click', e => {
    if (e.target.closest('.kr-steer')) { STEER = (STEER + 1) % STEERS.length; store.set('kartSteer', STEER); }
    if (e.target.closest('.kr-ann')) { ANN = !ANN; store.set('kartAnn', ANN ? '1' : '0'); }
    if (e.target.closest('.kr-snd')) { SOUND = !SOUND; store.set('kartSound', SOUND ? '1' : '0'); if (!SOUND && eng && AC) engOff(); }
    if (e.target.closest('.kr-ctl')) { SET.ctl = SET.ctl === 'analog' ? 'hold' : 'analog'; saveSet(); resize(); }
    if (e.target.closest('.kr-q')) { SET.q = (SET.q + 1) % 3; saveSet(); resize(); if (S && T) { drawBG(); } }
    if (e.target.closest('.kr-cam')) { SET.cam = (SET.cam + 1) % 3; saveSet(); }
    if (e.target.closest('.kr-tod')) { SET.tod = SET.tod === 'day' ? 'real' : 'day'; saveSet(); }
    if (e.target.closest('.kr-steer, .kr-ann, .kr-snd, .kr-ctl, .kr-q, .kr-cam, .kr-tod')) setTxt(); });
  box.querySelector('.kr-pbtn').addEventListener('click', pause);
  pm.addEventListener('click', e => {
    if (e.target.closest('.kr-resume')) resume();
    if (e.target.closest('.kr-restart')) { pm.hidden = true; startRace(); }
    if (e.target.closest('.kr-back')) toMenu();
    if (e.target.closest('.kr-quit')) { pm.hidden = true; close(); }
  });
  box.addEventListener('click', e => { if (e.target.closest('.kr-menu .kr-quit, .kr-res .kr-quit')) close(); });
  menu.addEventListener('click', e => {
    const b = e.target.closest('.kr-pick button'); if (b) { me = b.dataset.id; makeVehicles(); renderMenu(); newRace(); S.paused = true; }
    const m = e.target.closest('.kr-mode button'); if (m) { MODE = m.dataset.mode; store.set('kartMode', MODE); RULE = MODE === 'daily' ? daily().rule : null; preview(MODE === 'cup' ? CUPSEL.t[0] : MODE === 'daily' ? daily().track.id : TRK); renderMenu(); }
    const cb = e.target.closest('.kr-cups button'); if (cb) { CUPSEL = CUPS.find(c => c.id === cb.dataset.c) || CUPS[0]; store.set('kartCup', CUPSEL.id); preview(CUPSEL.t[0]); renderMenu(); }
    const sb = e.target.closest('.kr-shop button'); if (sb && !sb.disabled) { const tu = tune(), c = TCOST[tu[sb.dataset.k]]; if (tu[sb.dataset.k] < 5 && coins() >= c) { addCoins(-c); tu[sb.dataset.k]++; store.set('kartTune', JSON.stringify(tu)); SFX.pick(); if (tu[sb.dataset.k] >= 5) ach('tuned'); renderMenu(); } }
    const ob = e.target.closest('.kr-cos button'); if (ob && !ob.disabled) { const C = COS.find(x => x.id === ob.dataset.c), o = loadJ('kartCosOwn');
      if (C && !cosOwn()(C) && !C.ach && coins() >= C.c) { addCoins(-C.c); o[C.id] = 1; store.set('kartCosOwn', JSON.stringify(o)); SFX.pick(); }
      if (C && cosOwn()(C)) { const m = loadJ('kartCos'); m[me] = C.id; store.set('kartCos', JSON.stringify(m)); HEADC = {}; } renderMenu(); }
    const pl0 = e.target.closest('.kr-pill'); if (pl0) { const d = menu.querySelector('.kr-' + pl0.dataset.open); if (d) { d.open = true; setTimeout(() => d.scrollIntoView({behavior: 'smooth', block: 'center'}), 30); } }
    const db0 = e.target.closest('.kr-diff button'); if (db0) { DIFF = +db0.dataset.d; store.set('kartDiff', DIFF); renderMenu(); }
    const gb = e.target.closest('.kr-ghost:not(.kr-diff) button'); if (gb) { GHOST.mode = gb.dataset.g; store.set('kartGhost', GHOST.mode); renderMenu(); }
    const t = e.target.closest('.kr-trk button'); if (t) { TRK = t.dataset.t; store.set('kartTrack', TRK); preview(TRK); renderMenu(); }
    const vb = e.target.closest('.kr-vehs:not(.kr-cos) button'); if (vb && !vb.disabled) { store.set('kartVeh', vb.dataset.v); makeVehicles(); newRace(); S.paused = true; renderMenu(); }
    if (e.target.closest('.kr-go')) { CUP = MODE === 'cup' ? {i: 0, pts: {}, races: [], list: CUPSEL.t, n: CUPSEL.n, e: CUPSEL.e} : null; RULE = MODE === 'daily' ? daily().rule : null; startRace(); }
  });
  res.addEventListener('click', e => {
    if (e.target.closest('.kr-again')) {
      if (CUP && CUP.done) { CUP = {i: 0, pts: {}, races: [], list: CUPSEL.t, n: CUPSEL.n, e: CUPSEL.e}; startRace(); }
      else if (CUP && CUP.i === CUP.list.length - 1) ceremony();
      else if (CUP) { CUP.i++; say('cupnext', 'Auf zum nächsten Rennen!', 1); startRace(); }
      else startRace(); }
    if (e.target.closest('.kr-res .kr-back')) toMenu();
  });
  // Steuerung: Daumen links/rechts, Item-Knopf; Tastatur
  const ptr = new Map();
  const lastTap = {L: 0, R: 0};
  const upd = () => { const v = [...ptr.values()]; INPUT.L = v.some(o => o.s === 'L'); INPUT.R = v.some(o => o.s === 'R');
    if (SET.ctl === 'analog') { INPUT.brake = v.length >= 2; const o = v[v.length - 1]; if (!o) INPUT.ax = null; else { const r = (o.x - W / 2) / (W * .3); INPUT.ax = Math.abs(r) < .08 ? 0 : clamp(r, -1, 1); } }
    else { INPUT.ax = null; INPUT.brake = false; } };
  cv.addEventListener('pointerdown', e => { e.preventDefault();
    const r = cv.getBoundingClientRect(), px = e.clientX - r.left, py = e.clientY - r.top; if (px > W - 80 && py > 46 && py < 124) { if (S) useItem(S.karts[0]); return; }   // Item-Fenster oben rechts antippen = Item benutzen
    try { cv.setPointerCapture(e.pointerId); } catch (x) {} const sd = px < W / 2 ? 'L' : 'R', now = performance.now();
    if (SET.ctl !== 'analog' && now - lastTap[sd] < 300) INPUT.dtap = {s: sd === 'L' ? -1 : 1, t: now}; lastTap[sd] = now;
    ptr.set(e.pointerId, {s: sd, x: px}); upd(); });
  cv.addEventListener('pointermove', e => { if (ptr.has(e.pointerId)) { const r = cv.getBoundingClientRect(), px = e.clientX - r.left; ptr.set(e.pointerId, {s: px < W / 2 ? 'L' : 'R', x: px}); upd(); } });
  const drB = box.querySelector('.kr-drift');
  drB.addEventListener('pointerdown', e => { e.preventDefault(); e.stopPropagation(); INPUT.drift = true; try { drB.setPointerCapture(e.pointerId); } catch (x) {} });
  ['pointerup', 'pointercancel', 'lostpointercapture'].forEach(n => drB.addEventListener(n, () => { INPUT.drift = false; }));
  ['pointerup', 'pointercancel', 'lostpointercapture'].forEach(t => cv.addEventListener(t, e => { ptr.delete(e.pointerId); upd(); }));
  itemBtn.addEventListener('pointerdown', e => { e.preventDefault(); e.stopPropagation(); if (S) useItem(S.karts[0]); });
  box.addEventListener('touchmove', e => { if (!e.target.closest('.kr-menu, .kr-res, .kr-pm')) e.preventDefault(); }, {passive: false});
  box.addEventListener('contextmenu', e => e.preventDefault());
  addEventListener('keydown', e => { if (box.hidden) return; if (e.key === 'Escape' || e.key === 'p') { if (!pm.hidden) resume(); else if (box.classList.contains('racing')) pause(); else close(); return; } INPUT.keys[e.key] = true; if (e.key === ' ') { e.preventDefault(); if (S) useItem(S.karts[0]); } if (e.key.startsWith('Arrow')) e.preventDefault(); });
  addEventListener('keyup', e => { INPUT.keys[e.key] = false; });
  addEventListener('resize', () => { if (!box.hidden) resize(); });
  document.addEventListener('visibilitychange', () => { if (document.hidden && !box.hidden) pause(); });
  try { teaser(); } catch (e) {}
  window.__kartAt = (i, l) => at(i, l); window.__kartTW = () => TW;
  window.__kart = {open, pause, resume, state: () => S, input: INPUT, step: dt => step(dt), draw: () => draw(), finish: () => finish(), say, bufs: () => BUF, load: id => preview(id), cup: () => CUP, lb: () => [LB, LBD, WR], daily, tracks: TRACKS.map(t => t.id)};
})();
</script>
