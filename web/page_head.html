<title>Brasilien 26/27</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@500;600&display=swap">
<style>
/* Layout: eine Lesespalte; Karte volle Breite; Tabellen scrollen in eigenem Container */
:root{
  --bg:#f2f5f1; --surface:#ffffff; --fg:#10231d; --muted:#4f625a; --line:#d6ded7;
  --accent:#1d6b55; --sky:#0d4f7a; --sun:#8a6100; --sunbg:#fbf1d2;
  --ok:#1d7a4f; --okbg:#e2f2e8; --warn:#8a5a00; --warnbg:#fbeccc; --open:#a33a2a; --openbg:#f8e2dd;
  --sea:#dcecef; --land:#eceee8; --landline:#c7cec3; --br:#f7f2da; --brline:#1d6b55; --legbg:#ffffff;
  --display:"Bricolage Grotesque",ui-sans-serif,system-ui,sans-serif;
  --body:"IBM Plex Sans",ui-sans-serif,system-ui,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0d1714; --surface:#14211c; --fg:#e4eee8; --muted:#9db0a7; --line:#26382f;
  --accent:#5cc09a; --sky:#7cbde6; --sun:#f2c230; --sunbg:#2f2a14;
  --ok:#7fd4a4; --okbg:#173326; --warn:#f0c46a; --warnbg:#35290f; --open:#f09a8a; --openbg:#3a1d18;
  --sea:#10282b; --land:#1a2420; --landline:#2f3d37; --br:#23302a; --brline:#5cc09a; --legbg:#14211c; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0d1714; --surface:#14211c; --fg:#e4eee8; --muted:#9db0a7; --line:#26382f;
  --accent:#5cc09a; --sky:#7cbde6; --sun:#f2c230; --sunbg:#2f2a14;
  --ok:#7fd4a4; --okbg:#173326; --warn:#f0c46a; --warnbg:#35290f; --open:#f09a8a; --openbg:#3a1d18;
  --sea:#10282b; --land:#1a2420; --landline:#2f3d37; --br:#23302a; --brline:#5cc09a; --legbg:#14211c; color-scheme:dark}
body{background:var(--bg);color:var(--fg);font:16px/1.55 var(--body)}
.wrap{max-width:1080px;margin:0 auto;padding-inline:16px;padding-block:28px 64px;display:grid;gap:44px}
h1,h2,h3{font-family:var(--display);text-wrap:balance;margin:0;line-height:1.1}
h1{font-size:clamp(2.4rem,7vw,4.2rem);font-weight:800;letter-spacing:-.02em}
h1 em{font-style:normal;color:var(--accent)}
h2{font-size:1.6rem;font-weight:800;margin-bottom:14px}
h3{font-size:1.05rem;font-weight:600;margin:18px 0 8px}
p{margin:0;max-width:68ch}
.eyebrow{font:600 .75rem var(--mono);letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.wrap > *{min-width:0}
header{display:grid;gap:14px}
.meta{display:flex;flex-wrap:wrap;gap:10px 28px;align-items:baseline}
.dates{font:600 1.25rem var(--mono);color:var(--sun)}
.crew{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:3px 12px;font-size:.9rem}
.chip b{font-weight:600}.chip.b{border-style:dashed}
.note{color:var(--muted);font-size:.92rem}
.facts{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}
.fact{border-top:2px solid var(--accent);padding-top:8px}
.fact strong{display:block;font:800 1.9rem var(--display)}
.fact span{color:var(--muted);font-size:.9rem}
figure{margin:0;border:1px solid var(--line);background:var(--sea);border-radius:10px;overflow:hidden}
figure svg{display:block;width:100%;height:auto}
figcaption{background:var(--surface);padding:10px 14px;font-size:.88rem;color:var(--muted);border-top:1px solid var(--line)}
/* Karte */
.sea{fill:var(--sea)}.land{fill:var(--land);stroke:var(--landline);stroke-width:.8}.br{fill:var(--br);stroke:var(--brline);stroke-width:1.4}
.fl{fill:none;stroke:var(--sky);stroke-width:2.6;stroke-dasharray:7 6;stroke-linecap:round}
.gr{fill:none;stroke:var(--accent);stroke-width:3.2;stroke-linecap:round}
.bt{fill:none;stroke:#1d8aa8;stroke-width:3;stroke-dasharray:2 5;stroke-linecap:round}
.arrowhead{fill:var(--sky)}
.dot{fill:#1d6b55;stroke:#fff;stroke-width:2.5}.dot2{fill:var(--sea);stroke:var(--sky);stroke-width:2}
.num{fill:#fff;font:700 15px var(--body);text-anchor:middle;dominant-baseline:central}
.lbl{fill:var(--fg);font:700 19px var(--display)}.sub{fill:var(--muted);font:500 14px var(--body)}
.tag{fill:var(--sky);font:600 13px var(--mono)}.ctry{fill:var(--muted);opacity:.75;font:600 13px var(--body);letter-spacing:3px}
.frame{fill:none;stroke:var(--fg);stroke-width:1.5}.framebg{fill:var(--sea);stroke:var(--fg);stroke-width:1.5}
.lead{fill:none;stroke:var(--fg);stroke-width:1;stroke-dasharray:3 3}
.legtxt{fill:var(--fg);font:500 14px var(--body)}.legbg{fill:var(--legbg);fill-opacity:.9;stroke:var(--line)}
/* Tabellen */
.tbl{overflow-x:auto;border:1px solid var(--line);border-radius:10px;background:var(--surface)}
table{border-collapse:collapse;width:100%;font-size:.93rem;min-width:640px}
th,td{text-align:left;padding:10px 12px;border-bottom:1px solid var(--line);vertical-align:top}
tr:last-child td{border-bottom:0}
th{font:600 .72rem var(--mono);letter-spacing:.08em;text-transform:uppercase;color:var(--muted);background:var(--bg)}
td.n{font-variant-numeric:tabular-nums;text-align:right;white-space:nowrap}
.code{font:600 .88rem var(--mono);color:var(--sky);white-space:nowrap}
.d{font:600 .88rem var(--mono);white-space:nowrap}
.pill{display:inline-block;font:600 .72rem var(--body);padding:2px 9px;border-radius:999px;white-space:nowrap}
.ok{background:var(--okbg);color:var(--ok)}.warn{background:var(--warnbg);color:var(--warn)}.open{background:var(--openbg);color:var(--open)}
/* Stationen */
.stops{display:grid;gap:0;border-left:2px solid var(--line);margin-left:14px}
.stop{position:relative;padding:0 0 26px 30px;display:grid;gap:4px}
.stop:last-child{padding-bottom:0}
.stop{min-width:0}.stop .d{white-space:normal}
.stop .no{position:absolute;left:-15px;top:0;width:28px;height:28px;border-radius:50%;background:#1d6b55;color:#fff;border:2px solid var(--bg);display:grid;place-items:center;font:700 .85rem var(--body)}
.stop .no.x{background:var(--muted)}
.stop .top{display:flex;flex-wrap:wrap;gap:6px 14px;align-items:baseline}
.stop h3{margin:0;font-size:1.3rem}
.stop ul{margin:4px 0 0;padding-left:18px;color:var(--muted);font-size:.93rem}
/* Tage */
.days{display:grid;grid-template-columns:auto 1fr;gap:0;border:1px solid var(--line);border-radius:10px;background:var(--surface);overflow:hidden}
.days dt,.days dd{margin:0;padding:9px 14px;border-bottom:1px solid var(--line)}
.days dt{font:600 .85rem var(--mono);white-space:nowrap;color:var(--muted)}
.days dt.k{color:var(--fg)}
.days dd{min-width:0}
.days > :nth-last-child(-n+2){border-bottom:0}
/* To-dos */
ol.todo{margin:0;padding:0;list-style:none;counter-reset:t;display:grid;gap:10px}
ol.todo li{counter-increment:t;display:grid;grid-template-columns:2.2rem 1fr;gap:10px;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:12px 14px}
ol.todo li::before{content:counter(t);font:800 1.3rem var(--display);color:var(--accent)}
ol.todo li.hot{border-color:var(--open)}ol.todo li.hot::before{color:var(--open)}
.cols{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:24px}
.cols > *{min-width:0}
ul.plain{margin:0;padding-left:18px;display:grid;gap:6px}
.pack{display:flex;flex-wrap:wrap;gap:6px}
.warnbox{background:var(--sunbg);border-radius:10px;padding:12px 14px;font-size:.93rem}
[hidden]{display:none!important}
.links{display:flex;flex-wrap:wrap;gap:6px;margin-top:4px}
.links a{font:600 .8rem var(--body);text-decoration:none;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:3px 11px}
.links a::after{content:" ↗";opacity:.6}
.links a:hover,.links a:focus-visible{border-color:var(--accent)}
/* Sprachfuehrer */
.speak-bar{display:flex;flex-wrap:wrap;gap:8px 16px;align-items:center;margin-bottom:12px}
.slow{display:flex;gap:8px;align-items:center;font-size:.92rem;cursor:pointer}
.slow input{width:18px;height:18px;accent-color:var(--accent)}
.phrases{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:14px}
.pcat{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:6px 14px 10px;min-width:0}
.pcat h3{margin:10px 0 4px}
.phr{display:grid;grid-template-columns:1fr auto;gap:2px 10px;align-items:center;padding:8px 0;border-bottom:1px solid var(--line)}
.phr:last-child{border-bottom:0}
.phr .de{font-size:.85rem;color:var(--muted)}
.phr .pt{font-weight:600;font-size:1.02rem}
.phr .say{font:500 .8rem var(--mono);color:var(--sky)}
.phr .txt{min-width:0}
.play{width:40px;height:40px;border-radius:50%;border:1px solid var(--accent);background:transparent;color:var(--accent);font-size:.95rem;cursor:pointer;display:grid;place-items:center}
.play:hover,.play.on{background:var(--accent);color:var(--bg)}
@media print{.play,.speak-bar{display:none!important}.pcat{break-inside:avoid}}
/* Reiter */
.tabs{position:sticky;top:env(safe-area-inset-top,0px);z-index:10;background:var(--bg);margin-inline:-16px;padding-inline:16px;border-bottom:1px solid var(--line)}
.tabs-in{display:flex;gap:4px;overflow-x:auto;scrollbar-width:none;-webkit-overflow-scrolling:touch}
.tabs-in::-webkit-scrollbar{display:none}
@media (max-width:700px){.tabs-in{mask-image:linear-gradient(90deg,#000 85%,transparent);-webkit-mask-image:linear-gradient(90deg,#000 85%,transparent)}}
.tabs a{flex:none;font:600 .9rem var(--body);color:var(--muted);text-decoration:none;padding:12px 12px 10px;border-bottom:3px solid transparent;white-space:nowrap}
.tabs a:hover{color:var(--fg)}
.tabs a[aria-selected="true"]{color:var(--accent);border-bottom-color:var(--accent)}
@media print{.tabs{display:none}}
/* Crew */
.crew-ov{display:grid;grid-template-columns:4fr 2fr;gap:14px;margin-bottom:22px}
.crew-ov .grp{background:var(--fg);color:var(--bg);border-radius:14px;padding:14px 12px 16px;min-width:0}
.crew-ov .grp h3{margin:0 0 12px;font:600 .72rem var(--mono);letter-spacing:.12em;text-transform:uppercase;text-align:center;opacity:.8}
.crew-ov .row{display:grid;gap:10px}
.crew-ov .grp.a .row{grid-template-columns:repeat(4,1fr)}
.crew-ov .grp.b .row{grid-template-columns:repeat(2,1fr)}
.crew-ov a{display:flex;flex-direction:column;align-items:center;justify-content:flex-start;gap:6px;text-align:center;text-decoration:none;color:inherit;min-width:0}
.crew-ov .av{width:84px;height:84px;max-width:100%;border-radius:50%;overflow:hidden;box-shadow:0 0 0 3px var(--sun);background:var(--accent);display:grid;place-items:center;font:800 1.6rem var(--display);color:var(--bg);transition:transform .15s}
.crew-ov a:hover .av,.crew-ov a:focus-visible .av{transform:scale(1.06)}
.crew-ov .av img{width:100%;height:100%;object-fit:cover;display:block}
.crew-ov b{font:700 .98rem var(--display)}
.crew-ov small{font-size:.72rem;opacity:.75;line-height:1.25;overflow-wrap:anywhere}
@media (max-width:700px){.crew-ov{grid-template-columns:1fr}.crew-ov .grp.b .row{grid-template-columns:repeat(2,minmax(0,120px));justify-content:center}}
@media (max-width:420px){.crew-ov .grp.a .row{grid-template-columns:repeat(2,1fr)}}
@media (prefers-reduced-motion:reduce){.crew-ov .av{transition:none}}
@media print{.crew-ov .av img{display:none}}
.crew-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:14px}
.pcard{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px;display:grid;gap:10px;align-content:start;justify-items:center;text-align:center;min-width:0}
.pcard.full{grid-column:1/-1;grid-template-columns:auto 1fr;justify-items:start;text-align:left;gap:14px 22px;align-items:start}
.avatar{width:96px;height:96px;border-radius:50%;overflow:hidden;background:var(--accent);color:var(--bg);display:grid;place-items:center;font:800 2.2rem var(--display);box-shadow:0 0 0 4px var(--bg),0 0 0 7px var(--sun)}
.pcard.full .avatar{width:150px;height:150px;font-size:3rem}
.avatar img{width:100%;height:100%;object-fit:cover;display:block}
.pcard h3{margin:0;font-size:1.35rem}
.pcard .nick{display:block;font:500 .9rem var(--body);color:var(--muted);margin-top:3px}
.pcard .role{display:inline-block;font:600 .75rem var(--mono);letter-spacing:.06em;text-transform:uppercase;color:var(--sun);margin-top:6px}
.pcard dl{margin:10px 0 0;display:grid;grid-template-columns:max-content 1fr;gap:6px 14px;font-size:.93rem}
.pcard dt{font-weight:600;color:var(--muted)}
.pcard dd{margin:0;min-width:0}
.pcard blockquote{margin:12px 0 0;padding:10px 14px;background:var(--sunbg);border-radius:12px 12px 12px 2px;font-weight:600;display:inline-block}
.pcard .soon{font-size:.85rem;color:var(--muted)}
.pcard .team{font-size:.72rem;color:var(--muted)}
@media (max-width:620px){.pcard.full{grid-template-columns:1fr;justify-items:center;text-align:center}.pcard dl{grid-template-columns:1fr;gap:2px;text-align:left}.pcard dd{margin-bottom:6px}}
.avatar button{all:unset;display:block;width:100%;height:100%;cursor:zoom-in}
.avatar button:focus-visible{outline:3px solid var(--sun);outline-offset:-3px}
.lightbox{position:fixed;inset:0;z-index:100;background:rgba(8,14,12,.97);display:grid;place-items:center;padding:calc(env(safe-area-inset-top,0px) + 16px) 16px calc(env(safe-area-inset-bottom,0px) + 16px);cursor:zoom-out}
.lightbox figure{margin:0;border:0;background:none;display:grid;gap:10px;justify-items:center;max-width:100%;max-height:100%}
.lightbox img{max-width:min(100%,900px);max-height:calc(100vh - 110px);width:auto;height:auto;border-radius:12px;object-fit:contain;box-shadow:0 10px 40px rgba(0,0,0,.5)}
.lightbox figcaption{background:none;border:0;color:#f2efe6;font:700 1.1rem var(--display);padding:0}
.lightbox .x{position:absolute;top:calc(env(safe-area-inset-top,0px) + 10px);right:14px;width:44px;height:44px;border-radius:50%;border:0;background:rgba(255,255,255,.14);color:#fff;font-size:1.6rem;line-height:1;cursor:pointer}
@media print{.avatar img{display:none}.lightbox{display:none!important}}
/* Drinks */
.dr-add{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px;display:grid;gap:14px;margin-bottom:16px}
.dr-step{display:grid;gap:8px;min-width:0}
.dr-who{display:flex;flex-wrap:wrap;gap:10px}
.dr-who button{all:unset;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:4px;font:600 .8rem var(--body);width:62px}
.dr-who .av{width:52px;height:52px;border-radius:50%;overflow:hidden;background:var(--accent);color:var(--bg);display:grid;place-items:center;font:800 1.2rem var(--display);box-shadow:0 0 0 2px var(--line);transition:box-shadow .15s}
.dr-who img{width:100%;height:100%;object-fit:cover}
.dr-who button[aria-checked="true"] .av{box-shadow:0 0 0 3px var(--bg),0 0 0 6px var(--sun)}
.dr-who button:focus-visible .av{outline:2px solid var(--accent);outline-offset:4px}
.dr-what button{font:600 .82rem var(--body);background:var(--surface);color:var(--fg);border:1px solid var(--line);border-radius:999px;padding:6px 11px;cursor:pointer}
.dr-what button small{font-weight:500;color:var(--muted)}
.dr-what button[aria-pressed="true"]{background:var(--accent);color:var(--bg);border-color:var(--accent)}
.dr-what button[aria-pressed="true"] small{color:var(--bg);opacity:.8}
.dr-custom summary,.dr-body summary{cursor:pointer;font-size:.88rem;color:var(--accent);font-weight:600}
.dr-cf{display:grid;grid-template-columns:auto 1fr;gap:8px 12px;align-items:center;margin-top:10px;max-width:420px}
.dr-cf input,.dr-cf select,.dr-when input[type=datetime-local],.dr-bodyform input,.dr-bodyform select{font:500 .92rem var(--body);background:var(--bg);color:var(--fg);border:1px solid var(--line);border-radius:8px;padding:7px 10px;min-width:0}
.dr-cf .btn{grid-column:2;justify-self:start}
.dr-when{display:flex;flex-wrap:wrap;gap:10px 16px;align-items:center}
.dr-when .eyebrow{width:100%}
.dr-go{display:flex;flex-wrap:wrap;gap:12px;align-items:center}
.dr-go .btn[disabled]{opacity:.45;cursor:not-allowed}
.dr-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:16px;margin-bottom:16px}
.dr-card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px 16px 16px;min-width:0;margin-bottom:16px}
.dr-grid .dr-card{margin-bottom:0}
.dr-head{display:flex;flex-wrap:wrap;gap:6px 12px;align-items:center;justify-content:space-between;margin-bottom:12px}
.dr-head h3{margin:0}
details.dr-card>summary,details.dr-add>summary{list-style:none;cursor:pointer;margin-bottom:0}
details.dr-card>summary::-webkit-details-marker,details.dr-add>summary::-webkit-details-marker,.dr-cat>summary::-webkit-details-marker{display:none}
details.dr-card>summary h3::after,details.dr-add>summary h3::after{content:"▾";display:inline-block;margin-left:8px;font-size:.9em;color:var(--muted);transition:transform .2s}
details.dr-card:not([open])>summary h3::after,details.dr-add:not([open])>summary h3::after{transform:rotate(-90deg)}
details[open].dr-card>summary,details[open].dr-add>summary{margin-bottom:12px}
details.dr-card:not([open]){padding-bottom:14px}
.dr-metric{margin-bottom:12px}
.dr-what{display:grid;gap:6px}
.dr-cat{border:1px solid var(--line);border-radius:10px;background:var(--bg)}
.dr-cat>summary{list-style:none;cursor:pointer;padding:8px 12px;font-weight:600;font-size:.9rem;display:flex;justify-content:space-between;gap:8px}
.dr-cat>summary::after{content:"▾";color:var(--muted);transition:transform .2s}
.dr-cat:not([open])>summary::after{transform:rotate(-90deg)}
.dr-cat>summary small{font-weight:500;color:var(--muted);margin-left:auto}
.dr-cat .chips{display:flex;flex-wrap:wrap;gap:6px;padding:0 10px 10px}
.seg.small button{font-size:.78rem;padding:4px 10px}
.dr-rank{position:relative}
.dr-row{position:absolute;left:0;right:0;height:52px;display:grid;grid-template-columns:1.6rem 40px minmax(0,1fr);gap:10px;align-items:center;transition:transform .6s cubic-bezier(.2,.8,.2,1)}
.dr-row .pl{font:800 1rem var(--display);color:var(--muted);text-align:right}
.dr-row .av{width:40px;height:40px;border-radius:50%;overflow:hidden;background:var(--accent);color:var(--bg);display:grid;place-items:center;font:800 1rem var(--display)}
.dr-row .av img{width:100%;height:100%;object-fit:cover}
.dr-row .bd{min-width:0;display:grid;gap:3px}
.dr-row .nm{font-weight:600;font-size:.9rem;display:flex;justify-content:space-between;gap:8px}
.dr-row .nm span{font:600 .85rem var(--mono);font-variant-numeric:tabular-nums;color:var(--fg)}
.dr-row .track{height:12px;background:var(--bg);border-radius:0 4px 4px 0}
.dr-row .bar{height:12px;background:var(--accent);border-radius:0 4px 4px 0;width:0;transition:width .6s cubic-bezier(.2,.8,.2,1);min-width:2px}
.dr-row.lead .pl::before{content:"👑";font-size:.8rem;margin-right:2px}
.dr-bac{display:grid;gap:8px}
.dr-bac .b{display:grid;grid-template-columns:32px minmax(0,1fr) auto;gap:10px;align-items:center}
.dr-bac .av{width:32px;height:32px;border-radius:50%;overflow:hidden;background:var(--accent);color:var(--bg);display:grid;place-items:center;font:800 .8rem var(--display)}
.dr-bac .av img{width:100%;height:100%;object-fit:cover}
.dr-bac .v{font:700 1rem var(--mono);font-variant-numeric:tabular-nums}
.dr-bac .l{font-size:.85rem;color:var(--muted)}
.dr-disc{margin-top:10px;font-size:.8rem}
.dr-days{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(14px,1fr);gap:2px;align-items:end;height:170px;padding-top:18px;border-bottom:1px solid var(--line);position:relative}
.dr-days-wrap{overflow-x:auto;padding-bottom:4px}
.dr-days .col{position:relative;height:100%;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;cursor:default}
.dr-days .col i{display:block;width:min(100%,24px);background:var(--accent);border-radius:4px 4px 0 0;min-height:0}
.dr-days .col.is-today b{text-decoration:underline}
