<title>Brasilien 26/27</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@500;600&display=swap">
<style>
/* Layout: eine Lesespalte; Kopf als dunkelgrünes Band mit Copacabana-Wellen; Farben aus der Flagge (Verde, Amarelo, Azul) */
:root{
  --bg:#f3f6f1; --surface:#ffffff; --fg:#0f2419; --muted:#4d6157; --line:#d4ddd5;
  --accent:#00843d; --sky:#1f3f8f; --sun:#8a6100; --sunbg:#fdf2cc;
  --verde:#00843d; --amarelo:#ffcf1f; --azul:#1f3f8f; --hero:#08361f; --hero-wave:#0c4a2b;
  --wave:url("data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A//www.w3.org/2000/svg%22%20width%3D%22120%22%20height%3D%2240%22%20viewBox%3D%220%200%20120%2040%22%3E%3Cpath%20d%3D%22M0%2010C20-2%2040-2%2060%2010S100%2022%20120%2010L120%2030C100%2042%2080%2042%2060%2030S20%2018%200%2030Z%22/%3E%3C/svg%3E");
  --ok:#1d7a4f; --okbg:#e2f2e8; --warn:#8a5a00; --warnbg:#fbeccc; --open:#a33a2a; --openbg:#f8e2dd;
  --sea:#dcecef; --land:#eceee8; --landline:#c7cec3; --br:#f7f2da; --brline:#1d6b55; --legbg:#ffffff;
  --display:"Bricolage Grotesque",ui-sans-serif,system-ui,sans-serif;
  --body:"IBM Plex Sans",ui-sans-serif,system-ui,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0d1714; --surface:#14211c; --fg:#e4eee8; --muted:#9db0a7; --line:#26382f;
  --accent:#3ccf7f; --sky:#93b1ff; --sun:#ffd54a; --sunbg:#2f2a14;
  --ok:#7fd4a4; --okbg:#173326; --warn:#f0c46a; --warnbg:#35290f; --open:#f09a8a; --openbg:#3a1d18;
  --sea:#10282b; --land:#1a2420; --landline:#2f3d37; --br:#23302a; --brline:#3ccf7f; --legbg:#14211c;
  --verde:#3ccf7f; --hero:#062817; --hero-wave:#0a3b22; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0d1714; --surface:#14211c; --fg:#e4eee8; --muted:#9db0a7; --line:#26382f;
  --accent:#3ccf7f; --sky:#93b1ff; --sun:#ffd54a; --sunbg:#2f2a14;
  --ok:#7fd4a4; --okbg:#173326; --warn:#f0c46a; --warnbg:#35290f; --open:#f09a8a; --openbg:#3a1d18;
  --sea:#10282b; --land:#1a2420; --landline:#2f3d37; --br:#23302a; --brline:#3ccf7f; --legbg:#14211c;
  --verde:#3ccf7f; --hero:#062817; --hero-wave:#0a3b22; color-scheme:dark}
body{background:var(--bg);color:var(--fg);font:16px/1.55 var(--body)}
.wrap{max-width:1080px;margin:0 auto;padding-inline:16px;padding-block:28px 64px;display:grid;gap:44px}
h1,h2,h3{font-family:var(--display);text-wrap:balance;margin:0;line-height:1.1}
h1{font-size:clamp(2.4rem,7vw,4.2rem);font-weight:800;letter-spacing:-.02em}
h1 em{font-style:normal;color:var(--accent)}
h2{font-size:1.6rem;font-weight:800;margin-bottom:14px}
h3{font-size:1.05rem;font-weight:600;margin:18px 0 8px}
p{margin:0;max-width:68ch}
.eyebrow{font:600 .75rem var(--mono);letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.wrap > *{min-width:0}
header{display:grid;gap:14px;position:relative;overflow:hidden;isolation:isolate;margin:-28px -16px 0;padding:34px 20px 26px;background:var(--hero);color:#f4f7f2;border-radius:0 0 26px 26px}
header{min-height:340px;align-content:end;padding-top:60px}
.hero-bg{position:absolute;inset:0;z-index:-2}
.hero-bg svg{width:100%;height:100%;display:block}
header::before{content:"";position:absolute;inset:0;z-index:-1;background:linear-gradient(180deg,rgba(4,20,12,.15) 0%,rgba(4,20,12,.35) 45%,rgba(4,20,12,.82) 100%),linear-gradient(90deg,rgba(4,20,12,.55),rgba(4,20,12,0) 70%)}
header h1,header .dates,header .eyebrow,header .note{text-shadow:0 2px 12px rgba(0,0,0,.45)}
header{--sky1:#2f8fd8;--sky2:#8fd0f2;--sky3:#ffe9bf;--sun-c:#ffe27a;--moon-cut:transparent;--sea1:#1aa3b8;--sea2:#0d6f8f;--hill1:#1f5e3c;--hill2:#2d7a4f;--sand:#f1d9a4;--palm:#0f2a1c}
header[data-time="morning"]{--sky1:#7ab8e8;--sky2:#f7c9a6;--sky3:#ffe7c2;--sun-c:#ffd98a}
header[data-time="sunset"]{--sky1:#2b2d6e;--sky2:#e9676a;--sky3:#ffb35c;--sun-c:#ffcf5c;--sea1:#b85a6a;--sea2:#3a2f6b;--hill1:#2a1f3d;--hill2:#3b2c52;--sand:#d8a878;--palm:#1a1026}
header[data-time="night"]{--sky1:#070b24;--sky2:#16225a;--sky3:#2e3b7a;--sun-c:#f4f1d6;--moon-cut:#0c1440;--sea1:#14224f;--sea2:#0a1233;--hill1:#0b1430;--hill2:#121d40;--sand:#3a3a55;--palm:#05070f}
header:has(.hero-photo)::before{background:linear-gradient(180deg,rgba(4,20,12,0) 0%,rgba(4,20,12,.1) 40%,rgba(4,20,12,.75) 100%),linear-gradient(90deg,rgba(4,20,12,.45),rgba(4,20,12,0) 60%)}
.hero-photo{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:62% 45%;transition:filter 1s}
header[data-time="morning"] .hero-photo{filter:sepia(.15) saturate(1.1) brightness(1.03)}
header[data-time="sunset"] .hero-photo{filter:sepia(.55) saturate(1.8) hue-rotate(-18deg) brightness(.9) contrast(1.05)}
header[data-time="night"] .hero-photo{filter:sepia(.6) hue-rotate(185deg) saturate(1.4) brightness(.45) contrast(1.1)}
@media print{.hero-photo{display:none}}
.hero-scene .stars{opacity:0}
header[data-time="night"] .hero-scene .stars{opacity:.9}
header[data-time="night"] .hero-scene .glint{opacity:.25}
.stop-img,.divider-scene,.today-img{border-radius:16px;overflow:hidden;line-height:0}
.stop-img,.divider-scene,.today-img{position:relative}
.scene-photo{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:var(--pos,50% 50%)}
.divider-scene .scene-photo{object-position:var(--pos-wide,var(--pos,50% 50%))}
.stop-img:has(.scene-photo){height:170px}
.today-img:has(.scene-photo){height:150px}
@media print{.scene-photo{display:none}}
.stop-imgs{display:grid;grid-template-columns:1fr 1fr;gap:8px;max-width:640px}
.stop-imgs .stop-img{margin:4px 0 8px}
@media (max-width:520px){.stop-imgs{grid-template-columns:1fr}.stop-imgs .stop-img{margin:2px 0}.stop-imgs{margin-bottom:8px}}
.stop-img{height:110px;margin:4px 0 8px;max-width:640px}
.stop-img svg,.divider-scene svg,.today-img svg{width:100%;height:100%;display:block}
.divider-scene{height:clamp(90px,16vw,150px);box-shadow:0 6px 20px rgba(0,0,0,.08)}
.today-img{height:96px;margin:-8px -8px 4px;border-radius:12px}
@media print{.divider-scene{display:none}.stop-img{height:70px}}
header::after{content:"";position:absolute;left:0;right:0;bottom:0;height:6px;background:linear-gradient(90deg,var(--verde) 0 33%,var(--amarelo) 33% 66%,var(--azul) 66%)}
header .eyebrow{color:#b9d3c3}
header h1{color:#fff}
header h1 em{color:var(--amarelo)}
header .dates{color:var(--amarelo)}
header .note{color:#c6d8cc}
header .chip{background:rgba(255,255,255,.08);border-color:rgba(255,255,255,.25);color:#fff}
@media (min-width:1112px){header{margin-inline:0;border-radius:0 0 26px 26px}}
h2::after{content:"";display:block;width:72px;height:10px;margin-top:8px;background:var(--amarelo);-webkit-mask:var(--wave) 0 0/36px 12px repeat-x;mask:var(--wave) 0 0/36px 12px repeat-x}
.today-head h2::after{display:none}
.tabs a[aria-selected="true"]{box-shadow:inset 0 -3px 0 var(--amarelo)}
.meta{display:flex;flex-wrap:wrap;gap:10px 28px;align-items:baseline}
.dates{font:600 1.25rem var(--mono);color:var(--sun)}
.crew{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:3px 12px;font-size:.9rem}
.chip b{font-weight:600}.chip.b{border-style:dashed}
.note{color:var(--muted);font-size:.92rem}
.facts{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}
.fact{border-top:2px solid var(--accent);padding-top:8px}
.fact strong{display:block;font:800 1.9rem var(--display)}
.fact span{color:var(--muted);font-size:.9rem}
figure{margin:0;border:1px solid var(--line);background:var(--sea);border-radius:10px;overflow:hidden}
figure svg{display:block;width:100%;height:auto}
figcaption{background:var(--surface);padding:10px 14px;font-size:.88rem;color:var(--muted);border-top:1px solid var(--line)}
/* Karte */
.sea{fill:var(--sea)}.land{fill:var(--land);stroke:var(--landline);stroke-width:.8}.br{fill:var(--br);stroke:var(--brline);stroke-width:1.4}
.fl{fill:none;stroke:var(--sky);stroke-width:2.6;stroke-dasharray:7 6;stroke-linecap:round}
.fl2{stroke-width:2;opacity:.6}
.fl.open{stroke:#d9822b}.flB{stroke:#8a4fbf}.ahO{fill:#d9822b}.ahB{fill:#8a4fbf}
:root[data-theme="dark"] .flB{stroke:#c79bf0}:root[data-theme="dark"] .ahB{fill:#c79bf0}:root[data-theme="dark"] .fl.open{stroke:#f0a050}:root[data-theme="dark"] .ahO{fill:#f0a050}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .flB{stroke:#c79bf0}:root:not([data-theme="light"]) .ahB{fill:#c79bf0}:root:not([data-theme="light"]) .fl.open{stroke:#f0a050}:root:not([data-theme="light"]) .ahO{fill:#f0a050}}
.ht{paint-order:stroke;stroke:var(--sea);stroke-width:5px;stroke-linejoin:round}
.gr{fill:none;stroke:var(--accent);stroke-width:3.2;stroke-linecap:round}
.bt{fill:none;stroke:#1d8aa8;stroke-width:3;stroke-dasharray:2 5;stroke-linecap:round}
.arrowhead{fill:var(--sky)}
.dot{fill:#1d6b55;stroke:#fff;stroke-width:2.5}.dot2{fill:var(--sea);stroke:var(--sky);stroke-width:2}
.num{fill:#fff;font:700 15px var(--body);text-anchor:middle;dominant-baseline:central}
.lbl{fill:var(--fg);font:700 19px var(--display)}.sub{fill:var(--muted);font:500 14px var(--body)}
.tag{fill:var(--sky);font:600 13px var(--mono)}.ctry{fill:var(--muted);opacity:.75;font:600 13px var(--body);letter-spacing:3px}
.frame{fill:none;stroke:var(--fg);stroke-width:1.5}.framebg{fill:var(--sea);stroke:var(--fg);stroke-width:1.5}
.lead{fill:none;stroke:var(--fg);stroke-width:1;stroke-dasharray:3 3}
.legtxt{fill:var(--fg);font:500 14px var(--body)}.legbg{fill:var(--legbg);fill-opacity:.9;stroke:var(--line)}
/* Tabellen */
.tbl{overflow-x:auto;border:1px solid var(--line);border-radius:10px;background:var(--surface)}
table{border-collapse:collapse;width:100%;font-size:.93rem;min-width:640px}
th,td{text-align:left;padding:10px 12px;border-bottom:1px solid var(--line);vertical-align:top}
tr:last-child td{border-bottom:0}
th{font:600 .72rem var(--mono);letter-spacing:.08em;text-transform:uppercase;color:var(--muted);background:var(--bg)}
td.n{font-variant-numeric:tabular-nums;text-align:right;white-space:nowrap}
.code{font:600 .88rem var(--mono);color:var(--sky);white-space:nowrap}
.d{font:600 .88rem var(--mono);white-space:nowrap}
.pill{display:inline-block;font:600 .72rem var(--body);padding:2px 9px;border-radius:999px;white-space:nowrap}
.ok{background:var(--okbg);color:var(--ok)}.warn{background:var(--warnbg);color:var(--warn)}.open{background:var(--openbg);color:var(--open)}
/* Stationen */
.stops{display:grid;gap:0;border-left:2px solid var(--line);margin-left:14px}
.stop{position:relative;padding:0 0 26px 30px;display:grid;gap:4px}
.stop:last-child{padding-bottom:0}
.stop{min-width:0}.stop .d{white-space:normal}
.stop .no{position:absolute;left:-15px;top:0;width:28px;height:28px;border-radius:50%;background:#1d6b55;color:#fff;border:2px solid var(--bg);display:grid;place-items:center;font:700 .85rem var(--body)}
.stop .no.x{background:var(--muted)}
.stop .top{display:flex;flex-wrap:wrap;gap:6px 14px;align-items:baseline}
.stop h3{margin:0;font-size:1.3rem}
.stop ul{margin:4px 0 0;padding-left:18px;color:var(--muted);font-size:.93rem}
/* Tage */
.days{display:grid;grid-template-columns:auto 1fr;gap:0;border:1px solid var(--line);border-radius:10px;background:var(--surface);overflow:hidden}
.days dt,.days dd{margin:0;padding:9px 14px;border-bottom:1px solid var(--line)}
.days dt{font:600 .85rem var(--mono);white-space:nowrap;color:var(--muted)}
.days dt.k{color:var(--fg)}
.days dd{min-width:0}
.days > :nth-last-child(-n+2){border-bottom:0}
.cols{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:24px}
.cols > *{min-width:0}
ul.plain{margin:0;padding-left:18px;display:grid;gap:6px}
.pack{display:flex;flex-wrap:wrap;gap:6px}
.warnbox{background:var(--sunbg);border-radius:10px;padding:12px 14px;font-size:.93rem}
[hidden]{display:none!important}
.links{display:flex;flex-wrap:wrap;gap:6px;margin-top:4px}
.links a{font:600 .8rem var(--body);text-decoration:none;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:3px 11px}
.links a::after{content:" ↗";opacity:.6}
.links a:hover,.links a:focus-visible{border-color:var(--accent)}
/* Sprachfuehrer */
.speak-bar{display:flex;flex-wrap:wrap;gap:8px 16px;align-items:center;margin-bottom:12px}
.slow{display:flex;gap:8px;align-items:center;font-size:.92rem;cursor:pointer}
.slow input{width:18px;height:18px;accent-color:var(--accent)}
.phrases{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:14px}
.pcat{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:6px 14px 10px;min-width:0}
.pcat h3{margin:10px 0 4px}
.phr{display:grid;grid-template-columns:1fr auto;gap:2px 10px;align-items:center;padding:8px 0;border-bottom:1px solid var(--line)}
.phr:last-child{border-bottom:0}
.phr .de{font-size:.85rem;color:var(--muted)}
.phr .pt{font-weight:600;font-size:1.02rem}
.phr .say{font:500 .8rem var(--mono);color:var(--sky)}
.phr .txt{min-width:0}
.play{width:40px;height:40px;border-radius:50%;border:1px solid var(--accent);background:transparent;color:var(--accent);font-size:.95rem;cursor:pointer;display:grid;place-items:center}
.play:hover,.play.on{background:var(--accent);color:var(--bg)}
@media print{.play,.speak-bar{display:none!important}.pcat{break-inside:avoid}}
/* Reiter */
.tabs{display:flex;align-items:center;gap:4px;position:sticky;top:env(safe-area-inset-top,0px);z-index:10;background:var(--bg);margin-inline:-16px;padding-inline:16px;border-bottom:1px solid var(--line)}
.tabs-in{flex:1;min-width:0;display:flex;gap:4px;overflow-x:auto;scrollbar-width:none;-webkit-overflow-scrolling:touch}
.tabs-in::-webkit-scrollbar{display:none}
@media (max-width:700px){.tabs-in{mask-image:linear-gradient(90deg,#000 85%,transparent);-webkit-mask-image:linear-gradient(90deg,#000 85%,transparent)}}
.tabs a{flex:none;font:600 .9rem var(--body);color:var(--muted);text-decoration:none;padding:12px 12px 10px;border-bottom:3px solid transparent;white-space:nowrap}
.tabs a:hover{color:var(--fg)}
.tabs a[aria-selected="true"]{color:var(--accent);border-bottom-color:var(--accent)}
@media print{.tabs{display:none}}
/* Crew */
.crew-ov{display:grid;grid-template-columns:4fr 2fr;gap:14px;margin-bottom:22px}
.crew-ov .grp{background:var(--hero);color:#f4f7f2;border-radius:14px;padding:14px 12px 16px;min-width:0}
.crew-ov .grp h3{margin:0 0 12px;font:600 .72rem var(--mono);letter-spacing:.12em;text-transform:uppercase;text-align:center;opacity:.8}
.crew-ov .row{display:grid;gap:10px}
.crew-ov .grp.a .row{grid-template-columns:repeat(4,1fr)}
.crew-ov .grp.b .row{grid-template-columns:repeat(2,1fr)}
.crew-ov a{display:flex;flex-direction:column;align-items:center;justify-content:flex-start;gap:6px;text-align:center;text-decoration:none;color:inherit;min-width:0}
.crew-ov .av{width:84px;height:84px;max-width:100%;border-radius:50%;overflow:hidden;box-shadow:0 0 0 3px var(--amarelo);background:var(--accent);display:grid;place-items:center;font:800 1.6rem var(--display);color:#fff;transition:transform .15s}
.crew-ov a:hover .av,.crew-ov a:focus-visible .av{transform:scale(1.06)}
.crew-ov .av img{width:100%;height:100%;object-fit:cover;display:block}
.crew-ov b{font:700 .98rem var(--display)}
.crew-ov small{font-size:.72rem;opacity:.75;line-height:1.25;overflow-wrap:anywhere}
@media (max-width:700px){.crew-ov{grid-template-columns:1fr}.crew-ov .grp.b .row{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:420px){.crew-ov .grp.a .row{grid-template-columns:repeat(2,1fr)}}
@media (prefers-reduced-motion:reduce){.crew-ov .av{transition:none}}
@media print{.crew-ov .av img{display:none}}
.crew-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:14px}
.pcard{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px;display:grid;gap:10px;align-content:start;justify-items:center;text-align:center;min-width:0}
.pcard.full{grid-column:1/-1;grid-template-columns:auto 1fr;justify-items:start;text-align:left;gap:14px 22px;align-items:start}
.avatar{width:96px;height:96px;border-radius:50%;overflow:hidden;background:var(--accent);color:var(--bg);display:grid;place-items:center;font:800 2.2rem var(--display);box-shadow:0 0 0 4px var(--bg),0 0 0 7px var(--sun)}
.pcard.full .avatar{width:150px;height:150px;font-size:3rem}
.avatar img{width:100%;height:100%;object-fit:cover;display:block}
.pcard h3{margin:0;font-size:1.35rem}
.pcard .nick{display:block;font:500 .9rem var(--body);color:var(--muted);margin-top:3px}
.pcard .role{display:inline-block;font:600 .75rem var(--mono);letter-spacing:.06em;text-transform:uppercase;color:var(--sun);margin-top:6px}
.pcard dl{margin:10px 0 0;display:grid;grid-template-columns:max-content 1fr;gap:6px 14px;font-size:.93rem}
.pcard dt{font-weight:600;color:var(--muted)}
.pcard dd{margin:0;min-width:0}
.pcard blockquote{margin:12px 0 0;padding:10px 14px;background:var(--sunbg);border-radius:12px 12px 12px 2px;font-weight:600;display:inline-block}
.pcard .soon{font-size:.85rem;color:var(--muted)}
.pcard .team{font-size:.72rem;color:var(--muted)}
@media (max-width:620px){.pcard.full{grid-template-columns:1fr;justify-items:center;text-align:center}.pcard dl{grid-template-columns:1fr;gap:2px;text-align:left}.pcard dd{margin-bottom:6px}}
.avatar button{all:unset;display:block;width:100%;height:100%;cursor:zoom-in}
.avatar button:focus-visible{outline:3px solid var(--sun);outline-offset:-3px}
.lightbox{position:fixed;inset:0;z-index:100;background:rgba(8,14,12,.97);display:grid;place-items:center;padding:calc(env(safe-area-inset-top,0px) + 16px) 16px calc(env(safe-area-inset-bottom,0px) + 16px);cursor:zoom-out}
.lightbox figure{margin:0;border:0;background:none;display:grid;gap:10px;justify-items:center;max-width:100%;max-height:100%}
.lightbox img{max-width:min(100%,900px);max-height:calc(100vh - 110px);width:auto;height:auto;border-radius:12px;object-fit:contain;box-shadow:0 10px 40px rgba(0,0,0,.5)}
.lightbox figcaption{background:none;border:0;color:#f2efe6;font:700 1.1rem var(--display);padding:0}
.lightbox .x{position:absolute;top:calc(env(safe-area-inset-top,0px) + 10px);right:14px;width:44px;height:44px;border-radius:50%;border:0;background:rgba(255,255,255,.14);color:#fff;font-size:1.6rem;line-height:1;cursor:pointer}
@media print{.avatar img{display:none}.lightbox{display:none!important}}
/* Drinks */
.dr-add{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px;display:grid;gap:14px;margin-bottom:16px}
.dr-step{display:grid;gap:8px;min-width:0}
.dr-whohead{display:flex;flex-wrap:wrap;gap:6px 12px;align-items:center;justify-content:space-between}
.dr-quick{display:flex;gap:6px}

.dr-cf input,.dr-cf select,.dr-when input[type=datetime-local],.dr-bodyform input,.dr-bodyform select{font:500 .92rem var(--body);background:var(--bg);color:var(--fg);border:1px solid var(--line);border-radius:8px;padding:7px 10px;min-width:0}

.dr-when{display:flex;flex-wrap:wrap;gap:10px 16px;align-items:center}

.dr-go{display:flex;flex-wrap:wrap;gap:12px;align-items:center}

.dr-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:16px;margin-bottom:16px}
.dr-card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px 16px 16px;min-width:0;margin-bottom:16px}

details.dr-card>summary,details.dr-add>summary{list-style:none;cursor:pointer;margin-bottom:0}

details.dr-card>summary h3::after,details.dr-add>summary h3::after{content:"▾";display:inline-block;margin-left:8px;font-size:.9em;color:var(--muted);transition:transform .2s}
details.dr-card:not([open])>summary h3::after,details.dr-add:not([open])>summary h3::after{transform:rotate(-90deg)}

.dr-rank{position:relative}
.dr-row{position:absolute;left:0;right:0;height:52px;display:grid;grid-template-columns:1.6rem 40px minmax(0,1fr);gap:10px;align-items:center;transition:transform .6s cubic-bezier(.2,.8,.2,1)}
.dr-row .pl{font:800 1rem var(--display);color:var(--muted);text-align:right}

.dr-row .bd{min-width:0;display:grid;gap:3px}
.dr-row .nm{font-weight:600;font-size:.9rem;display:flex;justify-content:space-between;gap:8px}

.dr-bac{display:grid;gap:8px}
.dr-bac .b{display:grid;grid-template-columns:32px minmax(0,1fr) auto;gap:10px;align-items:center}
.dr-bac .av{width:32px;height:32px;border-radius:50%;overflow:hidden;background:var(--accent);color:var(--bg);display:grid;place-items:center;font:800 .8rem var(--display)}

.dr-disc{margin-top:10px;font-size:.8rem}

.dr-days .col.is-today b{text-decoration:underline}

.dr-days-ax{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(14px,1fr);gap:2px;font:500 .66rem var(--mono);color:var(--muted);margin-top:4px}

.dr-tip{position:fixed;z-index:50;background:var(--fg);color:var(--bg);padding:8px 10px;border-radius:8px;font-size:.82rem;pointer-events:none;max-width:240px;box-shadow:0 6px 20px rgba(0,0,0,.25)}
.dr-table{min-width:560px}
.dr-table td.z{color:var(--muted)}
.dr-table td:first-child{white-space:nowrap}

.dr-table td.pp{text-align:center;white-space:nowrap;font-variant-numeric:tabular-nums}
.dr-table .mini{display:inline-block;width:22px;height:22px;border-radius:50%;overflow:hidden;vertical-align:middle;background:var(--accent);color:var(--bg);font:800 .7rem/22px var(--display);text-align:center}

.dr-log{list-style:none;margin:0;padding:0;display:grid;gap:2px;max-height:360px;overflow-y:auto}

.dr-bodyform{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:10px;margin-top:10px}

.fl-prog{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px 16px;display:grid;gap:8px}
.fl-prog .row{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:baseline;gap:6px 14px}
.fl-prog b.big{font:800 1.5rem var(--display)}
.fl-bar{height:12px;border-radius:999px;background:var(--openbg);overflow:hidden;display:flex}
.fl-bar i{display:block;height:100%;background:var(--ok)}
.fl-bar i.chk{background:var(--amarelo)}
.fl-tip{font-size:.9rem;color:var(--muted)}
.fl-tip b{color:var(--fg)}
.fl-list{list-style:none;margin:0;padding:0 0 0 18px;display:grid;gap:14px;position:relative}
.fl-list::before{content:"";position:absolute;left:5px;top:10px;bottom:10px;border-left:2px dashed var(--line)}
.fl-item{position:relative}
.fl-item::before{content:"";position:absolute;left:-18px;top:22px;width:12px;height:12px;border-radius:50%;background:var(--bg);border:2px solid var(--accent)}
.fl-item.st-open::before{border-color:var(--open)}
.pass{background:var(--surface);border:1px solid var(--line);border-radius:16px;overflow:hidden;position:relative;box-shadow:0 4px 14px rgba(0,0,0,.05)}
.pass-top{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:10px 16px;background:var(--hero);color:#f4f7f2;font:600 .78rem var(--mono);letter-spacing:.08em;text-transform:uppercase}
.pass-top .who{opacity:.85}
.pass-main{padding:14px 16px 12px;display:grid;grid-template-columns:minmax(0,1fr) auto minmax(0,1fr);align-items:center;gap:6px 10px;position:relative}
.pass-main .ap{min-width:0}
.pass-main .ap.to{text-align:right}
.pass-main .code{display:block;font:800 clamp(1.9rem,9vw,2.6rem)/1 var(--display);color:var(--fg);letter-spacing:-.01em;white-space:nowrap}
.pass-main .city{display:block;font-size:.8rem;color:var(--muted);margin-top:4px;overflow-wrap:anywhere}
.pass-main .mid{display:grid;justify-items:center;gap:2px;color:var(--accent);min-width:64px}
.pass-main .mid svg{width:30px;height:30px}
.pass-main .mid .line{width:100%;border-top:2px dotted var(--line)}
.pass-main .via{font:600 .68rem var(--mono);color:var(--muted);text-transform:uppercase;letter-spacing:.06em;white-space:nowrap}
.pass-cut{height:0;border-top:2px dashed var(--line);margin:0 12px;position:relative}
.pass-cut::before,.pass-cut::after{content:"";position:absolute;top:-10px;width:20px;height:20px;border-radius:50%;background:var(--bg);border:1px solid var(--line)}
.pass-cut::before{left:-23px}.pass-cut::after{right:-23px}
.pass-foot{padding:12px 16px 14px;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px 14px;align-items:end}
.pass-foot .dur{grid-column:1/-1}
@media (max-width:480px){.pass-foot{grid-template-columns:repeat(2,minmax(0,1fr))}.pass-foot .who{grid-column:1/-1}}
.pass-foot .k{display:block;font:600 .66rem var(--mono);letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.pass-foot .v{font-weight:600;font-size:.95rem}
.pass-foot .v.mono{font-family:var(--mono)}
.pass-av{display:flex}
.pass-av span{width:28px;height:28px;border-radius:50%;overflow:hidden;background:var(--accent);color:#fff;display:grid;place-items:center;font:800 .75rem var(--display);border:2px solid var(--surface);margin-left:-8px}
.pass-av span:first-child{margin-left:0}
.pass-av img{width:100%;height:100%;object-fit:cover}
.stamp{transform:rotate(-5deg);font:800 .72rem var(--mono);letter-spacing:.12em;padding:2px 9px;border:2px solid currentColor;border-radius:7px;background:#fff}
.stamp.st-booked{color:#1d7a4f}.stamp.st-open{color:#a33a2a}.stamp.st-check{color:#8a5a00}
.pass-note{margin:0 16px 12px;font-size:.88rem;color:var(--muted)}
.pass-warn{margin:0 16px 12px;padding:8px 12px;background:var(--sunbg);border-radius:10px;font-size:.88rem}
.pass-state{margin:0 16px 12px;font-size:.85rem;font-weight:600}
.pass-state.st-open{color:var(--open)}.pass-state.st-booked{color:var(--ok)}.pass-state.st-check{color:var(--warn)}
.pass-links{display:flex;flex-wrap:wrap;gap:8px;margin:0 16px 14px}
.pass-links a{font:600 .82rem var(--body);text-decoration:none;border:1px solid var(--accent);color:var(--accent);border-radius:999px;padding:5px 12px}
.pass-links a:hover{background:var(--accent);color:var(--bg)}
.pass .uns{color:var(--warn)}
@media print{.pass-links{display:none}.pass{break-inside:avoid;box-shadow:none}.pass-av img{display:none}}
/* Kosten */
.co{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px;display:grid;gap:12px;max-width:640px}
.co + .co{margin-top:14px}
.co-sum{display:flex;flex-wrap:wrap;align-items:baseline;justify-content:space-between;gap:4px 14px}
.co-sum .grp{font:600 .72rem var(--mono);letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.co-sum b{font:800 clamp(1.8rem,8vw,2.4rem) var(--display)}
.co-bar{height:14px;border-radius:999px;background:var(--line);overflow:hidden;display:flex}
.co-bar i{height:100%;display:block}
.co-bar .c-flug{background:var(--azul)}.co-bar .c-stay{background:var(--verde)}.co-bar .est{opacity:.45}
.co-leg{display:flex;flex-wrap:wrap;gap:4px 14px;font-size:.85rem;color:var(--muted)}
.co-leg i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px;vertical-align:middle}
.co-leg i.c-flug{background:var(--azul)}.co-leg i.c-stay{background:var(--verde)}.co-leg i.est-key{background:var(--muted);opacity:.4}

@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .co-bar .c-flug,:root:not([data-theme="light"]) .co-leg i.c-flug{background:#93b1ff}}
.co-grp{border:1px solid var(--line);border-left:5px solid var(--azul);border-radius:12px;padding:4px 12px 2px}
.co-grp.c-stay{border-left-color:var(--verde)}
.co-gh{display:flex;justify-content:space-between;align-items:baseline;padding:8px 0 4px;border-bottom:2px solid var(--line);font:700 1rem var(--display)}
.co-gh b{font:800 1.05rem var(--display);font-variant-numeric:tabular-nums}.co-gh b small{font:600 .75rem var(--body);color:var(--muted)}
.co-list{list-style:none;margin:0;padding:0;display:grid}
.co-list li{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;padding:9px 0;border-bottom:1px solid var(--line);font-size:.95rem}
.co-list li:last-child{border-bottom:0}
.co-l{display:grid;gap:1px;min-width:0}.co-a{color:inherit;text-decoration:underline dotted 1px;text-underline-offset:3px}.co-a span{font-size:.75em;color:var(--muted)}.co-a:hover{color:var(--azul)}.co-l b{font-weight:600}.co-l small{font-size:.78rem;color:var(--muted)}
.co-r{display:grid;justify-items:end;gap:2px}
.co-list .v{font-variant-numeric:tabular-nums;font-weight:700;white-space:nowrap}
.co-list .v.c-ca{color:var(--warn)}.co-list .v.c-open{color:var(--open)}.co-list .v.c-split{color:var(--muted);font-weight:500}
.co .st{font:600 .68rem var(--body);font-style:normal;border-radius:999px;padding:1px 7px;white-space:nowrap}
.co .st.ok{background:var(--okbg);color:var(--ok)}.co .st.ca{background:var(--warnbg);color:var(--warn)}.co .st.op{background:var(--openbg);color:var(--open)}.co .st.sp{background:var(--bg);color:var(--muted)}
/* Real-Rechner */
.fx{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px;display:grid;grid-template-columns:minmax(0,1fr);gap:12px;max-width:640px}
.fx-dir{display:inline-flex;justify-self:start;border:1px solid var(--line);border-radius:999px;background:var(--bg);padding:3px}
.fx-dir button{font:600 .88rem var(--body);border:0;background:transparent;color:var(--muted);padding:6px 14px;border-radius:999px;cursor:pointer}
.fx-dir button[aria-pressed="true"]{background:var(--accent);color:var(--bg)}
.fx-in{display:flex;align-items:center;gap:10px;background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:6px 14px}
.fx-in:focus-within{border-color:var(--accent)}
.fx-cur{font:800 1.4rem var(--display);color:var(--muted)}
.fx-in input{flex:1;min-width:0;border:0;background:transparent;color:var(--fg);font:800 2rem var(--display);padding:4px 0;outline:none}
.fx-quick{display:flex;flex-wrap:wrap;gap:6px}
.fx-quick button{font:600 .85rem var(--body);background:var(--bg);color:var(--fg);border:1px solid var(--line);border-radius:999px;padding:5px 12px;cursor:pointer}
.fx-quick button:hover{border-color:var(--accent)}
.fx-out{background:var(--hero);color:#f4f7f2;border-radius:12px;padding:14px 16px;display:grid;gap:6px}
.fx-res{font:800 clamp(1.6rem,6vw,2.2rem)/1.1 var(--display);color:var(--amarelo)}
.fx-joke{font-size:1rem;min-height:1.5em;transition:opacity .25s}
.fx-joke.fade{opacity:0}
.fx-foot{display:flex;flex-wrap:wrap;gap:8px 16px;align-items:center;justify-content:space-between}
.fx-foot .btn{margin:0}
.fx-rate{font-size:.9rem;color:var(--muted);display:flex;align-items:center;gap:6px}
.fx-rate input{width:5.5rem;font:600 .95rem var(--body);background:var(--bg);color:var(--fg);border:1px solid var(--line);border-radius:8px;padding:5px 8px}
@media print{#rechner{display:none}}
@media (prefers-reduced-motion:reduce){.fx-joke{transition:none}}
/* Praktisches */
.grid-info{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:12px}
.info{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:12px 14px;min-width:0}
.info h3{margin:0 0 6px}
.info p{font-size:.93rem}
/* Packlisten */
ul.pack2{list-style:none;margin:0;padding:0;display:grid;gap:2px}
.pack2 label{display:flex;gap:10px;align-items:center;padding:5px 0;cursor:pointer}

.pack2 input:checked + span{text-decoration:line-through;color:var(--muted)}
/* Downloads */
.dl{display:grid;gap:10px;align-content:start}
.gcal{margin:0;padding-left:18px;font-size:.9rem;display:grid;gap:4px}
.wa{white-space:pre-wrap;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:14px;font:500 .9rem/1.5 var(--mono);margin:0 0 10px;overflow-x:auto}

}
footer{color:var(--muted);font-size:.85rem;padding-top:26px;position:relative}

/* ---------- Struktur: Themen-Kacheln, Kapitel-Farben, Teil-Banner, Kino ---------- */
:root{--k-plan:#00843d;--k-fun:#8a4fbf;--k-go:#1f5fbf;--k-info:#a86b00;--k-kino:#c2185b}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--k-plan:#3ccf7f;--k-fun:#c79bf0;--k-go:#93b1ff;--k-info:#ffd54a;--k-kino:#ff6fa8}}
:root[data-theme="dark"]{--k-plan:#3ccf7f;--k-fun:#c79bf0;--k-go:#93b1ff;--k-info:#ffd54a;--k-kino:#ff6fa8}
section[data-kind="start"]{--k:var(--accent)}section[data-kind="plan"],.k-plan{--k:var(--k-plan)}section[data-kind="fun"],.k-fun{--k:var(--k-fun)}
section[data-kind="go"],.k-go{--k:var(--k-go)}section[data-kind="info"],.k-info{--k:var(--k-info)}section[data-kind="kino"],.k-kino{--k:var(--k-kino)}
section[data-kind] h2 .ico{display:inline-grid;place-items:center;width:1.55em;height:1.55em;border-radius:.45em;margin-right:.45em;font-size:.82em;vertical-align:.08em;background:color-mix(in srgb,var(--k) 16%,transparent);box-shadow:inset 0 0 0 1.5px color-mix(in srgb,var(--k) 35%,transparent)}
section[data-kind] h2::after{background:var(--k)}
section[data-kind="plan"],section[data-kind="fun"],section[data-kind="go"],section[data-kind="info"]{border-top:3px solid color-mix(in srgb,var(--k) 45%,transparent);padding-top:18px}
.tabs a span{margin-right:2px}
.tiles{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin-top:-18px}
@media (max-width:639px){.tiles .tile:last-child{grid-column:1/-1}}
@media (min-width:640px){.tiles{grid-template-columns:repeat(3,minmax(0,1fr))}}
@media (min-width:900px){.tiles{grid-template-columns:repeat(5,minmax(0,1fr))}}
.tile{display:grid;grid-template-columns:auto minmax(0,1fr);grid-template-rows:auto auto;column-gap:10px;align-items:center;text-decoration:none;color:var(--fg);background:var(--surface);border:1px solid var(--line);border-left:5px solid var(--k);border-radius:14px;padding:10px 10px 10px 10px;min-height:66px;transition:transform .15s,box-shadow .15s}
.tile:hover,.tile:focus-visible{transform:translateY(-2px);box-shadow:0 6px 16px rgba(0,0,0,.1)}
.tile-i{grid-row:1/3;width:42px;height:42px;border-radius:12px;display:grid;place-items:center;font-size:1.45rem;background:color-mix(in srgb,var(--k) 15%,transparent)}

.tile small.live{color:var(--k);font-weight:700}

/* Kompakter: Packlisten als Kästen, Rechner enger, Faustregeln eingeklappt */
.pk-wrap{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:10px;align-items:start}

.fx{gap:9px;padding:12px 14px;align-items:start}

.fx-in{padding:2px 12px}.fx-in input{font-size:1.6rem;padding:2px 0}
.fx-pad{gap:5px}.fx-pad button{height:38px;font-size:1.05rem}.fx-pad button.c{height:30px}
.fx-out{padding:10px 14px}
